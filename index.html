<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Empire Categoriser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with sequential step tabs, one focused workspace below. Data-dense but calm. */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#14212A; --muted:#5B6B75; --line:#DDE4E7;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFC;
  --c-bill:#0E7490; --c-old:#1B7F4B; --c-new:#B86E00; --c-exc:#B42318; --c-scope:#66737C;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,33,42,.06),0 4px 16px rgba(20,33,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151A; --surface:#161F26; --surface-2:#1B262E; --ink:#E5ECEF; --muted:#94A4AE; --line:#263540;
  --accent:#7FA2FF; --accent-ink:#0B1220; --accent-soft:#1B2A4A;
  --c-bill:#4FC3DC; --c-old:#4CC38A; --c-new:#F0A83A; --c-exc:#FF7A6E; --c-scope:#93A3AD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#161F26; --surface-2:#1B262E; --ink:#E5ECEF; --muted:#94A4AE; --line:#263540;
  --accent:#7FA2FF; --accent-ink:#0B1220; --accent-soft:#1B2A4A;
  --c-bill:#4FC3DC; --c-old:#4CC38A; --c-new:#F0A83A; --c-exc:#FF7A6E; --c-scope:#93A3AD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--font-display);font-size:18px;font-weight:700}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.step{appearance:none;background:none;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap;font-weight:500}
.step .n{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;display:grid;place-items:center;font-family:var(--font-mono)}
.step:hover{background:var(--surface-2);color:var(--ink)}
.step[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.step.done .n{background:var(--c-old);border-color:var(--c-old);color:#fff}
.step .badge{background:var(--c-new);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--font-mono)}
.rulesbtn{margin-left:auto}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:24px}
.pagehead p{margin:2px 0 0;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.pop{box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;color:var(--ink);min-width:0}
input[type=text]:focus,select:focus,input[type=number]:focus{border-color:var(--accent)}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* upload */
.upgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--font-display);font-size:18px}
.accts{display:flex;flex-direction:column;gap:2px}
.acct{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.acct:hover{background:var(--surface-2)}
.acct.sel{border-color:var(--accent);background:var(--accent-soft)}
.acct .nm{min-width:0;overflow-wrap:anywhere}
.acct small{color:var(--muted);display:block}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.cls{color:var(--accent);border-color:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--c)}
.tile:hover{box-shadow:var(--shadow)}
.tile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:var(--c)}
.tile .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1}
.tile .lbl{font-weight:600;font-size:13px}
.tile .sub{font-size:12px;color:var(--muted)}
.l-bill{--c:var(--c-bill)}.l-old{--c:var(--c-old)}.l-new{--c:var(--c-new)}.l-exception{--c:var(--c-exc)}.l-scope{--c:var(--c-scope)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.plain::before{display:none}
.flagchip{color:var(--c-new);background:color-mix(in srgb,var(--c-new) 13%,transparent);font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.sub{color:var(--muted);font-size:12px}
.in{color:var(--c-old)}
.why td{background:var(--surface-2);font-size:13px}
.why ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ellip{overflow-wrap:anywhere}

/* resolve */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.rc{display:flex;flex-direction:column;gap:12px}
.rc.done{opacity:.75;border-color:var(--c-old)}
.rc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc-head .amt{font-size:18px;font-weight:500}
.rc .why{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--muted);font-weight:400}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
progress{width:200px;height:8px;accent-color:var(--c-old)}

/* review */
.flag{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.flag .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sev-warn{color:var(--c-new)}.sev-crit{color:var(--c-exc)}
.signoff{display:grid;grid-template-columns:minmax(0,260px) auto 1fr;gap:14px;align-items:end}
.stat{display:flex;gap:24px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:22px}
.exports{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.exp{display:flex;flex-direction:column;gap:8px}
.exp p{margin:0;color:var(--muted);font-size:13px;flex:1}
.lock{text-align:center;padding:36px 16px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}

/* rules */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
td input[type=text],td input[type=number],td input[type=date]{min-width:110px}
td input[type=checkbox]{width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:30;max-width:calc(100vw - 32px)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.upgrid{grid-template-columns:1fr}.signoff{grid-template-columns:1fr}}
@media (max-width:760px){.steps{order:3;flex:1 0 100%}.rulesbtn{margin-left:auto}}
@media (max-width:520px){.two{grid-template-columns:1fr}.pagehead h2{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:box-shadow .15s,border-color .15s}}
</style>

<header class="topbar"><div class="topin">
  <div class="brand"><b>Empire Categoriser</b><span>Bank feed to SaasAnt</span></div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <button class="btn rulesbtn" id="rulesBtn">Rules &amp; lists</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* Empire categorisation engine. Pure functions, no DOM. Mirrors SOP sections 4, 4.1, 5, 8, 9. */
const Engine = (() => {
  const RESERVED_CLASSES = ['WI', 'NOLA', 'Ohio', 'Pownwall', 'Not Specified', 'Unclassified'];
  const PERSONAL_KEYWORDS = ['cassville', 'cassiwille', 'wisconsin', 'ohio', 'nola', 'pownwall'];
  const SCOPE_KEYWORDS = ['xola', 'viator', 'payroll', 'distribution', 'transfer'];

  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  }

  function toCSV(rows) {
    const esc = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return rows.map(r => r.map(esc).join(',')).join('\r\n') + '\r\n';
  }

  function money(s) {
    if (s == null) return 0;
    const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function isoDate(s) {
    const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
    return s;
  }

  // Strip the multicurrency _G / _E suffixes and casing so spellings compare equal.
  function vendorKey(name) {
    return String(name || '').replace(/_(G|E)$/i, '').replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function cleanVendor(name) {
    return String(name || '').replace(/_(G|E)$/i, '').replace(/\s+/g, ' ').trim();
  }

  function extractVendor(desc, payee) {
    if (payee && payee.trim()) return cleanVendor(payee);
    let d = String(desc || '');
    d = d.replace(/^(sent money to|sent money|received money|paid to|card transaction of [\d.]+ [a-z]+ (issued )?by)\s*/i, '');
    d = d.replace(/\s*ref:.*$/i, '').replace(/^(miss|mr|mrs|ms)\s+/i, '');
    return cleanVendor(d);
  }

  function loadFeed(csvText, account, forced) {
    const recs = parseCSV(csvText);
    const pick = (r, ...names) => { for (const n of names) { const k = Object.keys(r).find(h => h.toLowerCase() === n); if (k && r[k] !== '') return r[k]; } return ''; };
    return recs.map((r, i) => {
      let spent = money(pick(r, 'spent', 'payment', 'debit', 'withdrawal')), rec = money(pick(r, 'received', 'deposit', 'credit'));
      const amt = pick(r, 'amount');
      if (!spent && !rec && amt) { const a = money(amt); if (a < 0) spent = -a; else rec = a; }
      const desc = pick(r, 'description', 'memo', 'name');
      const payee = pick(r, 'payee', 'vendor');
      const dateRaw = pick(r, 'date');
      return {
        id: 't' + i,
        dateRaw, date: isoDate(dateRaw),
        desc, payee, vendor: extractVendor(desc, payee),
        amount: Math.round((rec - spent) * 100) / 100,
        suggestedGL: pick(r, 'categorize or match', 'category'),
        suggestedClass: pick(r, 'class'),
        force: !!(forced && forced.has('t' + i)),
        accountNum: account.num, accountName: account.name
      };
    }).filter(t => t.desc || t.payee || t.amount);
  }

  // whole-word match so "Nolan" is not NOLA and "Transferwise" is not a transfer
  const hasWord = (text, w) => new RegExp('(^|[^a-z])' + w + 's?([^a-z]|$)', 'i').test(text);
  const wordHit = (text, word) => new RegExp('(^|[^a-z])' + word + '([^a-z]|$)', 'i').test(text);

  function classFromKeywords(desc) {
    if (/chicago/i.test(desc)) return { cls: 'Chicago', why: 'description contains "Chicago"' };
    if (wordHit(desc, 'nyc') || wordHit(desc, 'ny') || /new york/i.test(desc)) return { cls: 'NYC', why: 'description contains NYC / NY / New York' };
    if (/see it all/i.test(desc)) return { cls: 'SIA', why: 'description contains "See It All"' };
    return null;
  }

  const US_PAYROLL_CLASSES = ['chicago', 'nyc', 'sia', 'washington dc'];
  const isReserved = c => RESERVED_CLASSES.map(x => x.toLowerCase()).includes(String(c || '').trim().toLowerCase());
  const glNumber = gl => { const m = String(gl || '').match(/^\s*(\d+)/); return m ? parseInt(m[1], 10) : null; };

  function classifyOne(tx, cfg, account) {
    const trace = [];
    const out = { lane: 'new', gl: '', cls: '', source: '', vendorKnown: false, adminReview: false, reason: '', trace, exKind: '', billStatus: '' };
    const vkey = vendorKey(tx.vendor);
    const descL = tx.desc.toLowerCase();

    // Section 1: journal-entry-driven items are never part of this pipeline
    if (!tx.force) {
      const gl = tx.suggestedGL || '';
      const g = glNumber(gl);
      const kw = SCOPE_KEYWORDS.find(k => hasWord(descL, k) || hasWord(vkey, k));
      const eq = g !== null && g >= 30000 && g < 40000;
      if (eq || g === 10031 || kw) {
        out.lane = 'scope';
        out.reason = eq ? 'Equity / distribution item. Posted by journal entry, never by this import.'
          : g === 10031 ? 'Sales clearing item (Xola / Viator). Posted by journal entry, never by this import.'
          : `Matches "${kw}". Posted by journal entry, never by this import.`;
        trace.push('Out of scope (SOP section 1): Xola, Viator, payroll, distributions and transfers follow their own JE process.');
        return out;
      }
    }

    // Step 2: open bill check, before any categorisation
    if (tx.amount < 0) {
      const bills = cfg.openBills.filter(b => vendorKey(b.vendor) === vkey);
      const hit = bills.find(b => Math.abs(Math.abs(b.amount) - Math.abs(tx.amount)) < 0.005);
      const vmAny = cfg.vendorMaster.find(v => vendorKey(v.vendor) === vkey);
      if (hit) {
        out.lane = 'bill'; out.billStatus = 'match';
        out.reason = `Matches an open bill of ${Math.abs(hit.amount).toFixed(2)}${hit.date ? ' dated ' + hit.date : ''}. Confirm with Pay Bills / Match in QBO.`;
        trace.push('Step 2: open bill found for this vendor and amount. Routed to the Bill Payments List, not categorised.');
        return out;
      }
      if (bills.length) {
        out.lane = 'bill'; out.billStatus = 'amount';
        out.reason = `Vendor has ${bills.length} open bill(s), none for this amount. A person checks for a part-payment before matching.`;
        trace.push('Step 2: vendor has open bills but the amount differs. Routed to the Bill Payments List.');
        return out;
      }
      if (vmAny && vmAny.billOnly) {
        out.lane = 'bill'; out.billStatus = 'nobill';
        out.reason = 'Bill-payment-only vendor with no open bill on file. Enter the bill first, then Pay Bills / Match.' + (vmAny.note ? ' ' + vmAny.note : '');
        trace.push('Step 2: bill-payment-only vendor (SOP 13.1). Never categorised as a standalone expense.');
        return out;
      }
      trace.push('Step 2: no open bill for this vendor. Continue to categorisation.');
    }

    if (!tx.vendor) {
      out.lane = 'exception'; out.exKind = 'novendor';
      out.reason = 'No vendor could be identified. Held in the Exception Queue, never posted under a placeholder.';
      trace.push('No vendor identifiable (SOP 6.1).');
      return out;
    }

    const emails = cfg.emailRules.filter(e => vendorKey(e.vendor) === vkey).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const email = emails[0];

    // Step 1b: personal-book keywords
    const pk = PERSONAL_KEYWORDS.find(k => hasWord(descL, k));
    if (pk && !(email && email.cls)) {
      out.lane = 'exception'; out.exKind = 'personal';
      out.reason = `Description contains "${pk}". This may belong to Steven Garcia's personal book. SOP 4.1 Step 1b is unconfirmed, so no rule is built and the row is held for the Reviewer and Jonathan.`;
      trace.push('Step 1b: personal-book keyword. Routed to the Exception Queue.');
      return out;
    }

    // Steps 3-5 of the daily procedure: bank rules, Vendor Master, Jonathan email log
    const cands = [];
    const rules = cfg.bankRules.filter(r => r.contains && descL.includes(r.contains.toLowerCase()));
    const exactRule = rules.find(r => r.vendor && vendorKey(r.vendor) === vkey);
    if (exactRule) { cands.push({ src: 'Bank rule', gl: exactRule.gl, cls: exactRule.cls }); trace.push(`Step 3: bank rule "${exactRule.contains}" fired on vendor and description.`); }
    const vm = cfg.vendorMaster.find(v => vendorKey(v.vendor) === vkey && !v.billOnly);
    if (vm && vm.gl) { cands.push({ src: 'Vendor Master', gl: vm.gl, cls: vm.cls }); trace.push('Step 4: exact vendor match in the Vendor Master.'); }
    if (email && email.gl) { cands.push({ src: 'Email rule', gl: email.gl, cls: email.cls }); trace.push(`Step 5: Jonathan email rule${email.date ? ' dated ' + email.date : ''}.`); }

    const misfire = !exactRule && rules[0];
    if (misfire) {
      out.reason = `Bank rule "${misfire.contains}" matched the description only, not the vendor. Possible keyword misfire, held for a person.`;
      trace.push('Fuzzy bank-rule match. Held (SOP section 5).');
      return out;
    }
    if (!cands.length) {
      out.reason = 'New vendor. Not found in any bank rule, the Vendor Master or the email log.';
      trace.push('Vendor not found in any of the three sources of truth.');
      return out;
    }

    out.vendorKnown = true;
    const gls = [...new Set(cands.map(c => c.gl).filter(Boolean))];
    const clss = [...new Set(cands.map(c => c.cls).filter(Boolean))];
    if (gls.length > 1 || clss.length > 1) {
      const pick = cands.find(c => c.src === 'Email rule') || cands[0];
      out.gl = pick.gl || ''; out.cls = pick.cls || ''; out.source = pick.src;
      out.reason = 'Sources disagree (' + cands.map(c => `${c.src}: ${c.gl || '-'} / ${c.cls || '-'}`).join('; ') + '). The most recent Jonathan email wins. A person confirms and the Reviewer fixes the stale source.';
      trace.push('Conflict between sources (SOP section 5). Held.');
      return out;
    }
    out.gl = gls[0]; out.source = cands.map(c => c.src).join(' + ');

    // Section 4.1 class waterfall, stopping at the first confident answer
    let clsFromEmail = false;
    if (email && email.cls) { out.cls = email.cls; clsFromEmail = true; trace.push('Class Step 1: class given in Jonathan email log.'); }
    else if (clss[0]) { out.cls = clss[0]; trace.push('Class Step 1: class held by the matched rule / Vendor Master entry.'); }
    else if (account.bankClass) { out.cls = account.bankClass; trace.push(`Class Step 2: bank account ${account.name} maps to ${account.bankClass}.`); }
    else {
      const k = classFromKeywords(tx.desc);
      if (k) { out.cls = k.cls; trace.push(`Class Step 4: ${k.why}.`); }
      else if (vm && vm.multiLocation) {
        out.reason = 'Vendor is used across more than one Empire location and neither the bank account nor the description gives the class. A person decides.';
        trace.push('Multi-location vendor, class unresolved (SOP section 5). Held.');
        return out;
      } else { out.cls = 'Administrative'; out.adminReview = true; trace.push('Class Step 5: nothing resolved the class. Administrative for now, added to the Administrative Class Review List.'); }
    }

    if (isReserved(out.cls)) {
      out.lane = 'exception'; out.exKind = 'reserved';
      out.reason = `Class "${out.cls}" is reserved for Steven Garcia's personal book or not allowed in Empire.`;
      return out;
    }
    // Class Step 3: non-US payroll classes are never guessed
    if (/payroll/i.test(out.gl) && !clsFromEmail && !US_PAYROLL_CLASSES.includes(out.cls.toLowerCase())) {
      out.reason = `Payroll entry with class "${out.cls}". Confirm the class against Louise Petrie's payroll email / Excel before posting.`;
      trace.push('Class Step 3: non-US payroll class must be verified. Held.');
      return out;
    }
    out.lane = 'old';
    out.reason = 'Matched with full confidence.';
    return out;
  }

  function proposeClass(tx, account) {
    if (account.bankClass) return { cls: account.bankClass, why: `bank account ${account.name}` };
    const k = classFromKeywords(tx.desc);
    if (k) return { cls: k.cls, why: k.why };
    return { cls: 'Administrative', why: 'default, will be added to the Admin Class Review List', admin: true };
  }

  function run(txs, cfg, account) {
    return txs.map(tx => {
      const r = classifyOne(tx, cfg, account);
      const prop = proposeClass(tx, account);
      return Object.assign({}, tx, r, { proposedClass: prop.cls, proposedWhy: prop.why, resolved: null });
    });
  }

  const isResolvedNew = r => !!(r.resolved && r.resolved.confirmed);
  const canConfirm = r => r.lane === 'new' || (r.lane === 'exception' && r.exKind === 'novendor');

  // Rows that enter the SaasAnt file: Old matches plus Team-Member-confirmed New rows
  function importRows(results) {
    return results.filter(r => r.lane === 'old' || (canConfirm(r) && isResolvedNew(r)))
      .map(r => {
        const conf = isResolvedNew(r);
        const f = conf ? r.resolved : { vendor: r.vendor, gl: r.gl, cls: r.cls };
        return { id: r.id, date: r.date, dateRaw: r.dateRaw, desc: r.desc, vendor: f.vendor || r.vendor, gl: f.gl, cls: f.cls, amount: r.amount,
          memo: conf ? 'Confirmed by ' + (r.resolved.by || 'team member') : 'Auto: ' + r.source,
          adminReview: conf ? f.cls === 'Administrative' : r.adminReview };
      });
  }

  // Section 8 automated review checks
  function checks(rows) {
    const flags = [];
    const isPL = r => { const g = glNumber(r.gl); return g !== null && g >= 40000; };

    // Duplicate postings: date, vendor, description, amount and account
    const groups = {};
    rows.forEach(r => { const k = [r.date, vendorKey(r.vendor), r.desc.toLowerCase(), r.amount.toFixed(2), r.gl].join('|'); (groups[k] = groups[k] || []).push(r); });
    Object.values(groups).filter(g => g.length > 1).forEach(g => flags.push({
      id: 'dup:' + g[0].id, kind: 'Possible duplicate posting', severity: 'warn',
      title: `${g.length} identical rows: ${g[0].vendor}, ${g[0].dateRaw}, ${g[0].amount.toFixed(2)}`,
      detail: 'Same date, vendor, description, amount and account. Verify against the source statement.'
    }));

    const pl = rows.filter(isPL);
    // Vendor to top-account consistency (P&L accounts only)
    const byVendor = {};
    pl.forEach(r => { (byVendor[vendorKey(r.vendor)] = byVendor[vendorKey(r.vendor)] || []).push(r); });
    Object.entries(byVendor).forEach(([k, g]) => {
      if (g.length < 2) return;
      const cnt = {}; g.forEach(r => cnt[r.gl] = (cnt[r.gl] || 0) + 1);
      const [topGl, topN] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      const pct = topN / g.length * 100;
      if (pct < 85) flags.push({ id: 'cons:' + k, kind: 'Account consistency', severity: 'warn', title: `${g[0].vendor}: ${pct.toFixed(0)}% on ${topGl}`, detail: `${g.length} rows across ${Object.keys(cnt).length} accounts in this batch, below the 85% line. Judge whether this is a genuine business vendor or an individual with mixed expenses.` });
    });

    // Description drift: the same recurring charge hitting different accounts
    const drift = {};
    pl.forEach(r => { const k = vendorKey(r.vendor) + '|' + r.desc.toLowerCase().replace(/ref:.*$/, '').replace(/[0-9]+/g, '#').trim(); (drift[k] = drift[k] || []).push(r); });
    Object.entries(drift).forEach(([k, g]) => {
      const set = [...new Set(g.map(r => r.gl))];
      if (g.length > 1 && set.length > 1) flags.push({ id: 'drift:' + k, kind: 'Description drift', severity: 'warn', title: `${g[0].vendor}: same description on ${set.length} accounts`, detail: set.join(' / ') + '. A recurring charge may have started hitting a different account partway through.' });
    });

    // Duplicate vendor records: same vendor, different spelling (the _G / _E suffixes are already merged)
    const names = [...new Set(rows.map(r => vendorKey(r.vendor)).filter(Boolean))];
    const tok = n => n.split(' ').filter(Boolean);
    for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
      const a = tok(names[i]), b = tok(names[j]);
      const same = a.length > 1 && b.length > 1 && a[0] === b[0] && a[a.length - 1] === b[b.length - 1];
      const squash = names[i].replace(/[^a-z0-9]/g, '') === names[j].replace(/[^a-z0-9]/g, '');
      if (same || squash) flags.push({ id: 'vdup:' + names[i] + '|' + names[j], kind: 'Possible duplicate vendor', severity: 'warn', title: `"${names[i]}" and "${names[j]}"`, detail: 'Looks like one vendor under two spellings. Check the date ranges for overlap versus a clean cutover before merging.' });
    }

    rows.forEach(r => {
      if (!r.vendor) flags.push({ id: 'nov:' + r.id, kind: 'Missing vendor', severity: 'crit', title: `No vendor on ${r.dateRaw} ${r.desc}`, detail: 'Nothing is posted without a vendor.' });
      if (!r.gl) flags.push({ id: 'nogl:' + r.id, kind: 'Missing account', severity: 'crit', title: `No account for ${r.vendor}`, detail: 'Every row needs a GL account.' });
      if (!r.cls || isReserved(r.cls)) flags.push({ id: 'cls:' + r.id, kind: 'Invalid class', severity: 'crit', title: `${r.vendor}: class "${r.cls || 'none'}"`, detail: 'Reserved or empty classes cannot be used in Empire.' });
    });
    return flags;
  }

  function saasantCSV(rows) {
    const head = ['Date', 'Description/Name', 'Vendor', 'Account', 'Class', 'Amount', 'Memo'];
    return toCSV([head].concat(rows.map(r => [r.dateRaw, r.desc, r.vendor, r.gl, r.cls, r.amount.toFixed(2), r.memo])));
  }

  return { parseCSV, toCSV, loadFeed, run, importRows, checks, saasantCSV, vendorKey, cleanVendor, money, isReserved, canConfirm, RESERVED_CLASSES };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>

  if(!list.length) return `<div class="pagehead"><div><h2>Resolve</h2></div></div><div class="card empty"><b>Nothing is waiting for a decision.</b>Every row was matched with confidence, sent to the bill list, or is out of scope.<br><br><button class="btn primary" data-view="review">Go to review</button></div>`;
  const cards = list.map(r => {
    const ok = r.resolved && r.resolved.confirmed; const held = r.lane==='exception' && !Engine.canConfirm(r); const d = ok || held ? null : draftFor(r);
    return `<div class="card rc ${ok?'done':''} l-${r.lane}" data-card="${r.id}">
      <div class="rc-head"><div style="min-width:0"><span class="chip l-${ok?'old':r.lane}">${ok?'Confirmed':LANE[r.lane]}</span><div class="sub" style="margin-top:6px">${esc(r.dateRaw)} · ${esc(r.desc)}</div></div><div class="amt num ${r.amount>0?'in':''}">${fmt(r.amount)}</div></div>

      <label class="f">GL account<input type="text" list="gls" data-d="${r.id}" data-k="gl" value="${esc(d.gl)}" placeholder="e.g. 50005 Cost of Goods Sold:Contract labor"><span class="hint">${r.suggestedGL?'QBO suggested "'+esc(r.suggestedGL)+'". Check it before you accept.':'Type the account exactly as it appears in QBO.'}</span></label>
      <div class="row" style="justify-content:space-between"><label class="check"><input type="checkbox" data-d="${r.id}" data-k="save" ${d.save?'checked':''}> Also add to the Vendor Master</label><button class="btn primary" data-confirm="${r.id}">Confirm</button></div>`}
    </div>`;
  }).join('');
  return `
  <div class="pagehead"><div><h2>Resolve what the rules could not</h2><p>Identify the real vendor, choose the account and class, then confirm. Nothing is guessed: rows you do not confirm stay out of the import.</p></div><div class="row"><progress max="${actionable.length||1}" value="${done}"></progress><span class="sub num">${done} of ${actionable.length} confirmed</span></div></div>
  ${member}
  <div class="rcards">${cards}</div>
  <datalist id="classes">${CLASSES.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <datalist id="gls">${glList.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  ${done===actionable.length?`<div class="row"><button class="btn primary" data-view="review">Continue to review</button></div>`:''}`;
}

function vReview(){
  if(!ready()) return noData('Reviewer checks and sign-off');
  const rows = batch(), flags = allFlags(), w = waiting().length;
  const spent = rows.filter(r=>r.amount<0).reduce((a,r)=>a+r.amount,0), recv = rows.filter(r=>r.amount>0).reduce((a,r)=>a+r.amount,0);
  const unacked = flags.filter(f => !S.acks[f.id]).length;
  const can = w===0 && unacked===0 && S.reviewer.trim() && rows.length;
  const fl = flags.length ? flags.map(f => `<div class="flag"><label class="check"><input type="checkbox" data-ack="${esc(f.id)}" ${S.acks[f.id]?'checked':''}></label><div><span class="kind sev-${f.severity}">${esc(f.kind)}</span><div><b>${esc(f.title)}</b></div><div class="sub">${esc(f.detail)}</div></div></div>`).join('') : `<div class="empty"><b>No flags.</b>No duplicates, inconsistent vendors, missing vendors or invalid classes in this batch.</div>`;
  return `
  <div class="pagehead"><div><h2>Reviewer checks and sign-off</h2><p>The section 8 checks run on the combined Old plus confirmed batch. This is the one hard gate: tick each flag once you have judged it, then sign off. The consistency check only sees this batch, so it is a spot-check, not a history check.</p></div></div>
  <div class="card pop"><div class="stat"><div><span class="sub">Rows in import</span><b class="num">${rows.length}</b></div><div><span class="sub">Money out</span><b class="num">${fmt(spent)}</b></div><div><span class="sub">Money in</span><b class="num">${fmt(recv)}</b></div><div><span class="sub">Held in exceptions</span><b class="num">${heldEx().length}</b></div><div><span class="sub">Admin class review</span><b class="num">${rows.filter(r=>r.adminReview).length}</b></div></div></div>
  ${w?`<div class="banner"><span><b>${w} row${w===1?'':'s'}</b> still need a decision before sign-off.</span><button class="btn" data-view="resolve">Resolve now</button></div>`:''}
  <div class="card"><h3 style="font-size:16px">Flags for the reviewer ${flags.length?`<span class="tag">${flags.length - unacked} of ${flags.length} reviewed</span>`:''}</h3>${fl}</div>
  <div class="card ${S.signed?'':'pop'}">${S.signed ? `<div class="row" style="justify-content:space-between"><span><span class="chip l-old">Signed off</span> by <b>${esc(S.signed.by)}</b> · ${esc(S.signed.at)}</span><button class="btn small" data-view="export">Go to export</button></div>` : `
    <div class="signoff"><label class="f">Reviewer name<input type="text" id="reviewer" value="${esc(S.reviewer)}" placeholder="e.g. Meera Iyer"></label><button class="btn primary" id="signBtn" ${can?'':'disabled'}>Sign off batch</button><span class="sub">${!rows.length?'No rows to import.':w?'Resolve all new rows first.':unacked?unacked+' flag(s) still to review.':!S.reviewer.trim()?'Enter the reviewer name.':'Ready. No row can be added after sign-off without repeating this step.'}</span></div>`}</div>`;
}

function vExport(){
  if(!ready()) return noData('Export');
  if(!S.signed) return `<div class="pagehead"><div><h2>Export</h2></div></div><div class="card lock"><b style="font-family:var(--font-display);font-size:18px;color:var(--ink)">Locked until the reviewer signs off</b><p>The SOP allows only a signed-off batch into the SaasAnt file.</p><button class="btn primary" data-view="review">Go to review</button></div>`;
  const rows = batch();
  const bills = S.results.filter(r => r.lane==='bill'), adm = rows.filter(r=>r.adminReview), ex = heldEx();
  const prev = rows.map(r => `<tr><td class="mono">${esc(r.dateRaw)}</td><td class="ellip">${esc(r.desc)}</td><td>${esc(r.vendor)}</td><td>${esc(r.gl)}</td><td>${esc(r.cls)}</td><td class="r num">${r.amount.toFixed(2)}</td><td class="sub">${esc(r.memo)}</td></tr>`).join('');
  const card = (t, p, id, n, primary) => `<div class="card exp"><h3 style="font-size:16px">${t}</h3><p>${p}</p><button class="btn ${primary?'primary':''}" id="${id}" ${n?'':'disabled'}>${n?'Save file ('+n+' rows)':'Nothing to export'}</button></div>`;
  return `
  <div class="pagehead"><div><h2>Export</h2><p>Signed off by ${esc(S.signed.by)}. Upload the SaasAnt file with the Bank Transactions template. Bill payments are worked directly in QuickBooks and never go into it. Confirm the header row against your SaasAnt Bank Transactions template before the first real import (SOP section 9).</p></div></div>
  <div class="exports">
    ${card('SaasAnt import file','Date, Description/Name, Vendor, Account, Class, Amount, Memo. Old matches plus confirmed rows.','xImport',rows.length,true)}
    ${card('Bill Payments List','Rows to settle with Pay Bills / Match in QuickBooks. No GL or class.','xBills',bills.length)}
    ${card('Admin Class Review List','Rows posted as Administrative for now, to revisit weekly.','xAdmin',adm.length)}
    <div class="card exp"><h3 style="font-size:16px">Weekly note for Jonathan</h3><p>New vendors, Administrative review items and exceptions, as text you can paste into email.</p><button class="btn" id="xWeekly">Copy note</button></div>
  </div>
  <h3 style="font-size:16px;margin-top:6px">Import file preview</h3>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Vendor</th><th>Account</th><th>Class</th><th class="r">Amount</th><th>Memo</th></tr></thead><tbody>${prev||'<tr><td colspan="7" class="empty">No rows.</td></tr>'}</tbody></table></div>`;
}

/* ---------- rules manager ---------- */
const TABS = {
  vendorMaster:{label:'Vendor Master', cols:[['vendor','Vendor'],['gl','GL account'],['cls','Class'],['billOnly','Bill only','check'],['multiLocation','Multi-location','check'],['note','Note']], blank:{vendor:'',gl:'',cls:'',billOnly:false,multiLocation:false,note:''}, help:'Known vendors and their correct account and class. "Bill only" vendors are always paid against a bill and never categorised. "Multi-location" vendors go to a person when neither the bank account nor the description gives the class.'},
  emailRules:{label:'Jonathan email rules', cols:[['vendor','Vendor'],['gl','GL account'],['cls','Class'],['date','Email date','date'],['note','Note']], blank:{vendor:'',gl:'',cls:'',date:'',note:''}, help:'Every instruction Jonathan gives by email, dated. Check new emails that are not logged yet before you upload. The most recent email wins over the Vendor Master and bank rules.'},
  bankRules:{label:'Bank rules', cols:[['contains','Description contains'],['vendor','Vendor'],['gl','GL account'],['cls','Class']], blank:{contains:'',vendor:'',gl:'',cls:''}, help:'A rule fires only when the description text and the vendor both match. A description-only match is held as a possible misfire.'},
  openBills:{label:'Open bills', cols:[['vendor','Vendor'],['amount','Amount','number'],['date','Bill date','date']], blank:{vendor:'',amount:0,date:''}, help:'Open bills in QuickBooks. A payment for the same vendor and amount goes to the Bill Payments List instead of being categorised.'},
  newVendorLog:{label:'New Vendor Log', cols:[['vendor','Vendor'],['gl','Proposed GL'],['cls','Proposed class'],['date','Coded on','date'],['by','Coded by'],['status','Status']], blank:{vendor:'',gl:'',cls:'',date:'',by:'',status:'proposed'}, help:'Filled automatically the moment a new vendor is confirmed. Stays "proposed" until it appears in the weekly send to Jonathan and is not challenged.'},
  accounts:{label:'Account classes'}
};
function vRules(){
  const T = TABS[S.rulesTab];
  const tabs = Object.entries(TABS).map(([k, v]) => `<button data-rtab="${k}" aria-pressed="${S.rulesTab===k}">${v.label}</button>`).join('');
  let body;
  if(S.rulesTab==='accounts'){
    body = `<div class="tablewrap"><table><thead><tr><th>Account</th><th>Class used when the bank decides it</th></tr></thead><tbody>${ACCOUNTS.map(a => `<tr><td>${esc(a.num)} ${esc(a.name)}</td><td><input type="text" list="classes" data-acls="${a.num}" value="${esc(S.cfg.classOverrides[a.num] ?? a.bankClass)}" placeholder="none"></td></tr>`).join('')}</tbody></table></div><datalist id="classes">${CLASSES.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><p class="sub">SOP step 2 sets NYC, SIA and Wise GBP. The other accounts are left blank so class falls back to keywords or Administrative.</p>`;
  } else {
    const list = S.cfg[S.rulesTab];
    const head = T.cols.map(c => `<th>${c[1]}</th>`).join('') + '<th></th>';
    const rws = list.map((row, i) => `<tr>${T.cols.map(([k,,ty]) => ty==='check' ? `<td><input type="checkbox" data-r="${i}" data-k="${k}" ${row[k]?'checked':''}></td>` : `<td><input type="${ty||'text'}" ${ty==='number'?'step="0.01"':''} data-r="${i}" data-k="${k}" value="${esc(row[k])}"></td>`).join('')}<td><button class="btn small ghost" data-del="${i}">Remove</button></td></tr>`).join('');
    body = `<p class="sub" style="margin:0">${T.help}</p><div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rws||`<tr><td colspan="${T.cols.length+1}" class="empty">Empty. Add the first entry.</td></tr>`}</tbody></table></div><div class="row"><button class="btn" data-add="1">Add row</button></div>`;
  }
  return `
  <div class="pagehead"><div><h2>Rules &amp; lists</h2><p>The three sources of truth plus open bills. Changes re-run the matching straight away and are kept in this browser.</p></div><button class="btn small" id="resetCfg">Reset to defaults</button></div>
  <div class="tabs">${tabs}</div><div class="card" style="display:flex;flex-direction:column;gap:12px">${body}</div>`;
}

function render(){
  renderSteps();
  const v = {upload:vUpload, results:vResults, resolve:vResolve, review:vReview, export:vExport, rules:vRules}[S.view] || vResults;
  const y = window.scrollY;
  $('#app').innerHTML = v();
  window.scrollTo(0, y);
}
function go(v){ S.view = v; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
async function saveFile(name, text){
  try{ if(S.dl){ await S.dl.save({filename:name, data:text}); toast('Saved '+name); return; } }
  catch(e){ if(e && e.code==='declined') return; }
  try{ await navigator.clipboard.writeText(text); toast('Saving is unavailable here. The file contents were copied instead.'); }
  catch(e){ toast('Could not save or copy this file here.'); }
}
async function copyText(text, ok){
  try{ await navigator.clipboard.writeText(text); toast(ok); } catch(e){ toast('Copy is blocked in this view.'); }
}
function weeklyNote(){
  const rows = batch();
  const L = ['Weekly categorisation update', ''];
  L.push('New Vendor Log (proposed account and class, please confirm or correct):');
  const nv = S.cfg.newVendorLog.filter(v => v.status==='proposed'); nv.length ? nv.forEach(v => L.push(`- ${v.vendor}: ${v.gl} / ${v.cls} (coded ${v.date})`)) : L.push('- none');
  L.push('', 'Administrative class review (please confirm or redirect to the real class):');
  const a = rows.filter(r=>r.adminReview); a.length ? a.forEach(r => L.push(`- ${r.dateRaw} ${r.vendor} ${fmt(r.amount)} (${r.gl})`)) : L.push('- none');
  L.push('', 'Unresolved exceptions:');
  const e = S.results.filter(r => r.lane==='exception' && !(r.resolved && r.resolved.confirmed)); e.length ? e.forEach(r => L.push(`- ${r.dateRaw} ${r.vendor||r.desc} ${fmt(r.amount)}: ${r.reason}`)) : L.push('- none');
  return L.join('\n');
}
function loadText(text, name){
  S.csv = text; S.fileName = name; S.filter = 'all';
  if(S.acctIdx < 0){ S.txs = []; S.results = []; toast('File received. Now pick the account it came from.'); return render(); }
  process();
  if(!S.txs.length){ S.csv = ''; toast('No transactions found. Check the column headers (Date, DESCRIPTION, Payee, SPENT, RECEIVED).'); return render(); }
  S.view = 'results'; render(); toast(`Loaded ${S.txs.length} transactions`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-filter],[data-open],[data-acct],[data-confirm],[data-undo],[data-rtab],[data-add],[data-del],button');
  if(!t) return;
  const d = t.dataset;
  if(d.view) return go(d.view);
  if(d.filter){ S.filter = S.filter===d.filter && d.filter!=='all' ? 'all' : d.filter; return render(); }
  if(d.open){ S.open[d.open] = !S.open[d.open]; return render(); }
  if(d.acct){ S.acctIdx = +d.acct; if(S.csv){ process(); if(S.txs.length){ S.view='results'; toast(`Loaded ${S.txs.length} transactions`); } } return render(); }
  if(d.rtab){ S.rulesTab = d.rtab; return render(); }
  if(d.add){ S.cfg[S.rulesTab].push(Object.assign({}, TABS[S.rulesTab].blank)); saveCfg(); return render(); }
  if(d.del!==undefined){ S.cfg[S.rulesTab].splice(+d.del, 1); saveCfg(); rerun(); return render(); }
  if(d.undo){ const r = S.results.find(x => x.id===d.undo); r.resolved = null; S.signed = null; return render(); }
  if(d.force){ const tx = S.txs.find(x => x.id===d.force); tx.force = true; rerun(); toast('Moved into categorisation'); return render(); }
  if(d.confirm){
    const r = S.results.find(x => x.id===d.confirm), dr = S.drafts[r.id];
    const bad = Engine.isReserved(dr.cls);
    if(!S.member.trim()) return toast('Enter the team member name first.');
    if(!dr.vendor.trim() || !dr.gl.trim() || !dr.cls.trim()) return toast('Vendor, GL account and class are all required.');
    if(bad) return toast(`"${dr.cls}" is reserved for Steven Garcia's personal book. Choose an Empire class.`);
    const isNew = !S.cfg.vendorMaster.some(v => Engine.vendorKey(v.vendor)===Engine.vendorKey(dr.vendor));
    r.resolved = {confirmed:true, vendor:dr.vendor.trim(), gl:dr.gl.trim(), cls:dr.cls.trim(), by:S.member.trim(), isNewVendor: isNew};
    if(isNew && !S.cfg.newVendorLog.some(v => Engine.vendorKey(v.vendor)===Engine.vendorKey(dr.vendor))) S.cfg.newVendorLog.push({vendor:dr.vendor.trim(), gl:dr.gl.trim(), cls:dr.cls.trim(), date:new Date().toISOString().slice(0,10), by:S.member.trim(), status:'proposed'});
    let extra = 0;
    saveCfg();
    if(dr.save && isNew){
      S.cfg.vendorMaster.push({vendor:dr.vendor.trim(), gl:dr.gl.trim(), cls:'', billOnly:false, multiLocation:false, note:'Added '+new Date().toISOString().slice(0,10)+' by '+S.member.trim()});
      saveCfg();
      const before = S.results.filter(x=>x.lane==='old' && x.id!==r.id).length; const keep = new Map(S.results.map(x => [x.id, x.resolved]));
      S.results = Engine.run(S.txs, S.cfg, acct()); S.results.forEach(x => x.resolved = keep.get(x.id)||null);
      extra = S.results.filter(x=>x.lane==='old' && x.id!==r.id).length - before;
    }
    S.signed = null; render();
    return toast(extra>0 ? `Confirmed. ${extra} other row(s) now match ${dr.vendor.trim()} automatically.` : 'Confirmed');
  }
  if(t.id==='rulesBtn') return go('rules');
  if(t.id==='signBtn'){ S.signed = {by:S.reviewer.trim(), at:new Date().toLocaleString()}; return render(); }
  if(t.id==='xImport') return saveFile('SaasAnt_Import_'+new Date().toISOString().slice(0,10)+'.csv', Engine.saasantCSV(batch()));
  if(t.id==='xBills') return saveFile('Bill_Payments_List.csv', Engine.toCSV([['Date','Vendor','Description','Amount','Status','Note']].concat(S.results.filter(r=>r.lane==='bill').map(r=>[r.dateRaw,r.vendor,r.desc,r.amount.toFixed(2),r.billStatus==='match'?'Open bill matched':r.billStatus==='amount'?'Check amount':'Enter bill first',r.reason]))));
  if(t.id==='xAdmin') return saveFile('Administrative_Class_Review_List.csv', Engine.toCSV([['Date','Vendor','Description','Amount','GL','Class']].concat(batch().filter(r=>r.adminReview).map(r=>[r.dateRaw,r.vendor,r.desc,r.amount.toFixed(2),r.gl,r.cls]))));
  if(t.id==='xWeekly') return copyText(weeklyNote(), 'Weekly note copied');
  if(t.id==='resetCfg'){ S.cfg = DEFAULT_CFG(); saveCfg(); rerun(); toast('Rules reset to defaults'); return render(); }
});
document.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.acct!==undefined){ e.preventDefault(); e.target.click(); } });

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='member'){ S.member = t.value; return; }
  if(t.id==='reviewer'){ S.reviewer = t.value; const b = $('#signBtn'); if(b){ const rows = batch(); b.disabled = !(waiting().length===0 && allFlags().every(f=>S.acks[f.id]) && S.reviewer.trim() && rows.length); } return; }
  if(t.dataset.d){ const d = S.drafts[t.dataset.d]; d[t.dataset.k] = t.type==='checkbox' ? t.checked : t.value; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if(d.ack!==undefined){ S.acks[d.ack] = t.checked; S.signed = null; return render(); }
  if(d.acls!==undefined){ S.cfg.classOverrides[d.acls] = t.value.trim(); saveCfg(); if(S.txs.length) process(); toast('Class updated'); return; }
  if(d.r!==undefined){
    const row = S.cfg[S.rulesTab][+d.r];
    row[d.k] = t.type==='checkbox' ? t.checked : t.type==='number' ? parseFloat(t.value)||0 : t.value.trim();
    saveCfg(); rerun(); return;
  }
  if(t.id==='file' && t.files[0]){ const f = t.files[0], rd = new FileReader(); rd.onload = () => loadText(String(rd.result), f.name); rd.readAsText(f); }
});
document.addEventListener('dragover', e => { const z = e.target.closest('#drop'); if(z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest('#drop'); if(z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest('#drop'); if(z){ e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files[0]; if(f){ const rd = new FileReader(); rd.onload = () => loadText(String(rd.result), f.name); rd.readAsText(f); } } });

loadCfg(); render();
try{ if(window.claude && claude.use) claude.use('downloads').then(d => { S.dl = d; }).catch(() => {}); }catch(e){}
</script>

</body></html>
