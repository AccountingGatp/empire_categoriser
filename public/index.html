/* Where the shared data lives: the Claude page's own database when this runs as an artifact,
   or this site's /api/db (Vercel function + Upstash Redis) when it runs on its own web address. */
async function getDb(){
  try{ if(window.claude && claude.use){ const d = await claude.use('db'); if(d) return d; } }catch(e){}
  if(/^https?:$/.test(location.protocol)) return restDb();
  return null;
}
function askKey(msg){
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'keyov';
    o.innerHTML = `<form class="card keybox"><h3>Team password</h3><p class="sub">Enter the password your team leader set for this app. It is asked once per browser.</p><input type="password" id="keyIn" autocomplete="current-password" placeholder="Password"><div class="hint" id="keyMsg">${msg||''}</div><div class="row"><button class="btn primary" type="submit">Open</button><button class="btn ghost" type="button" id="keyCancel">Work without team storage</button></div></form>`;
    document.body.appendChild(o);
    const f = o.querySelector('form'), i = o.querySelector('#keyIn'); i.focus();
    f.addEventListener('submit', e => { e.preventDefault(); const v = i.value; o.remove(); res(v); });
    o.querySelector('#keyCancel').addEventListener('click', () => { o.remove(); res(null); });
  });
}
async function restDb(){
  let key = ''; try{ key = localStorage.getItem('empire-key') || ''; }catch(e){}
  const api = async (op, extra) => {
    const r = await fetch('/api/db', {method:'POST', headers:{'content-type':'application/json', 'x-app-key':key}, body:JSON.stringify(Object.assign({op}, extra || {}))});
    if(r.status === 401) throw {code:'unauthorized'};
    if(r.status === 404 || r.status === 405) throw {code:'nobackend'};
    if(!r.ok){ let m = ''; try{ m = (await r.json()).error; }catch(e){} throw {code:'unavailable', message:m}; }
    return r.json();
  };
  for(let tries = 0; ; tries++){
    try{ await api('rev'); break; }
    catch(e){
      if(e.code === 'unauthorized'){ const k = await askKey(tries ? 'That password was not accepted. Try again.' : ''); if(k === null) return null; key = k; continue; }
      if(e.code === 'unavailable'){ toast('Team storage is not set up: ' + (e.message || 'the server did not answer') + ' Working in this browser only.'); }
      return null;
    }
  }
  try{ localStorage.setItem('empire-key', key); }catch(e){}
  const st = {rev:null, colls:{}, loaded:false}, watchers = new Set();
  const split = p => { const i = p.lastIndexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
  const docSnap = p => { const [c, id] = split(p), j = (st.colls[c] || {})[id]; return {id, exists:j != null, data:() => j != null ? JSON.parse(j) : undefined, metadata:{}}; };
  const collSnap = p => { const m = st.colls[p] || {}, docs = Object.keys(m).sort().map(id => ({id, exists:true, data:() => JSON.parse(m[id]), metadata:{}})); return {docs, size:docs.length, empty:!docs.length, metadata:{}}; };
  const sigOf = w => w.kind === 'doc' ? String((st.colls[split(w.path)[0]] || {})[split(w.path)[1]]) : JSON.stringify(st.colls[w.path] || {});
  const notify = () => watchers.forEach(w => { if(!st.loaded) return; const sig = sigOf(w); if(!w.sent || sig !== w.sig){ w.sent = true; w.sig = sig; w.next(w.kind === 'doc' ? docSnap(w.path) : collSnap(w.path)); } });
  let pulling = false;
  async function pull(force){
    if(pulling) return; pulling = true;
    try{ const s = await api('snapshot', {rev:force ? null : st.rev}); if(!s.same){ st.rev = s.rev; st.colls = s.colls || {}; st.loaded = true; notify(); } else if(!st.loaded){ st.loaded = true; notify(); } }
    catch(e){ if(e.code === 'unauthorized'){ try{ localStorage.removeItem('empire-key'); }catch(_){} } }
    finally{ pulling = false; }
  }
  let poll = null;
  const ensurePolling = () => { if(poll) return; pull(true); poll = setInterval(() => { if(document.visibilityState === 'visible') pull(false); }, 15000); document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pull(false); }); };
  const write = async (op, p, j) => { const [c, id] = split(p); await api(op, {path:p, json:j}); st.colls[c] = st.colls[c] || {}; if(op === 'set') st.colls[c][id] = j; else delete st.colls[c][id]; st.rev = null; notify(); };
  const mkDoc = p => ({id:split(p)[1], path:p,
    get:async () => { await pull(false); return docSnap(p); },
    set:async d => { const j = JSON.stringify(d); if(j.length > 900000) throw {code:'invalid_argument', message:'document too large'}; await write('set', p, j); },
    delete:async () => { await write('del', p); },
    onSnapshot(next){ const w = {kind:'doc', path:p, next, sent:false, sig:''}; watchers.add(w); ensurePolling(); if(st.loaded) notify(); return () => watchers.delete(w); }});
  const mkColl = p => ({path:p, doc:id => mkDoc(p + '/' + id),
    onSnapshot(next){ const w = {kind:'coll', path:p, next, sent:false, sig:''}; watchers.add(w); ensurePolling(); if(st.loaded) notify(); return () => watchers.delete(w); }});
  return {doc:mkDoc, collection:mkColl};
}
async function cloudStart(){
  let db = null;
  try{ db = await getDb(); }catch(e){ db = null; }
  if(!db){ renderPill(); return; }
  CL.db = db; CL.waiting = 0; renderPill();
  const onErr = e => { if(e && e.code === 'revoked'){ CL.db = null; } renderPill(); };
  const docKeys = ['team/cfg','team/coa','team/classes','team/bills','master/meta'];
  const colls = {masterrows:'masterrows', added:'added', emailrules:'emailrules', bankrules:'bankrules', nvlog:'nvlog', payroll:'payroll'};
  CL.waiting = docKeys.length + Object.keys(colls).length;
  const first = k => { if(!CL.seen[k]){ CL.seen[k] = true; if(--CL.waiting === 0){ CL.ready = true; applyAll(true); renderPill(); if(CL.want) cloudPush(); } } };
  docKeys.forEach(p => db.doc(p).onSnapshot(s => { CL.snap[p] = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; got(p); first(p); }, onErr));
  Object.values(colls).forEach(c => db.collection(c).onSnapshot(s => { CL.snap[c] = s.docs.map(d => Object.assign({_id:d.id}, JSON.parse(JSON.stringify(d.data())))); got(c); first(c); }, onErr));
}
function got(k){ if(!CL.ready) return; if(CL.dirty || CL.flushing){ CL.stale = true; return; } applyAll(false); }

function listApply(name, coll){
  const rows = CL.snap[coll]; if(rows == null) return false;
  if(!rows.length && !CL.seenApplied?.[coll]){ (CL.seenApplied = CL.seenApplied || {})[coll] = true; return false; }   // nothing shared yet: keep this browser's copy so it can be shared
  (CL.seenApplied = CL.seenApplied || {})[coll] = true;
  const isAdded = coll === 'added';
  const next = isAdded ? rows.map(r => ({_id:r._id, vendor:r.vendor, raw:r.raw, by:r.by, at:r.at})) : rows;
  const cur = isAdded ? S.mAdded : S.cfg[name];
  const strMap = arr => ss(arr.map(r => [r._id, ss(isAdded ? {vendor:r.vendor, raw:r.raw, by:r.by, at:r.at} : (({_id, ...rest}) => rest)(r))]).sort());
  if(strMap(cur) === strMap(next)) { CL.last['list:' + coll] = mapOf(next, isAdded); return false; }
  next.sort((a, b) => String(a._id).localeCompare(String(b._id)));
  if(isAdded) S.mAdded = next; else S.cfg[name] = next;
  CL.last['list:' + coll] = mapOf(next, isAdded);
  return true;
}
function mapOf(arr, isAdded){ const m = {}; arr.forEach(r => { m[r._id] = ss(isAdded ? {vendor:r.vendor, raw:r.raw, by:r.by, at:r.at} : (({_id, ...rest}) => rest)(r)); }); return m; }

function applyAll(initial){
  let changed = false, masterChanged = false;
  const S1 = CL.snap;
  const cfg = S1['team/cfg'];
  if(cfg){ const before = ss(clDocs()['team/cfg']); const merged = Object.assign({}, S.cfg, cfg); S.cfg = merged; if(ss(clDocs()['team/cfg']) !== before) changed = true; CL.last['team/cfg'] = ss(clDocs()['team/cfg']); }
  const coa = S1['team/coa'];
  if(coa){ if(ss({list:S.coa, source:S.coaSource}) !== ss(coa)){ S.coa = coa.list||[]; S.coaSource = coa.source||''; changed = true; } CL.last['team/coa'] = ss({list:S.coa, source:S.coaSource}); }
  const cls = S1['team/classes'];
  if(cls){ if(ss({list:S.classesUp, source:S.classSource}) !== ss(cls)){ S.classesUp = cls.list||[]; S.classSource = cls.source||''; changed = true; } CL.last['team/classes'] = ss({list:S.classesUp, source:S.classSource}); }
  const po = S1['team/payouts'];
  if(po){ if(ss({list:S.cfg.payoutIndex||[]}) !== ss({list:po.list||[]})){ S.cfg.payoutIndex = po.list||[]; changed = true; } CL.last['team/payouts'] = ss({list:S.cfg.payoutIndex||[]}); }
  const bills = S1['team/bills'];
  if(bills){
    if(bills.at === today()){ const cur = ss({list:S.cfg.openBills, at:S.cfg.billsAt, none:!!S.cfg.noOpenBills}); if(cur !== ss(bills)){ S.cfg.openBills = bills.list||[]; S.cfg.billsAt = bills.at; S.cfg.noOpenBills = !!bills.none; changed = true; } CL.last['team/bills'] = ss({list:S.cfg.openBills, at:S.cfg.billsAt, none:!!S.cfg.noOpenBills}); }
    else if(S.cfg.billsAt !== today() && (S.cfg.openBills.length || S.cfg.noOpenBills)){ S.cfg.openBills = []; S.cfg.noOpenBills = false; changed = true; }
  }
  // master file: only when the meta and all its chunks belong to the same revision
  const meta = S1['master/meta'], chunks = S1['masterrows'];
  if(meta && chunks){
    const mine = chunks.filter(c => c.rev === meta.rev).sort((a, b) => a.i - b.i);
    if(mine.length === meta.n){
      const rows = [].concat(...mine.map(c => c.rows));
      const remote = {header:meta.header, excl:meta.excl, meta:meta.meta, rows};
      if(ss(remote) !== ss(clMasterObj())){ S.mHeader = meta.header||[]; S.exclAoa = meta.excl||[]; S.mMeta = meta.meta||null; S.mBase = rows; masterChanged = true; }
      CL.last.master = ss(remote); CL.nChunks = meta.n;
    }
  }
  if(listApply('', 'added')) masterChanged = true;
  ['emailRules','bankRules','newVendorLog','payrollMap'].forEach(k => { if(listApply(k, CL_LISTS[k])) changed = true; });
  CL.stale = false;
  if(changed || masterChanged){
    saveLocal();
    if(masterChanged) rebuildMaster();
    if(S.feeds.length) rerun();
    softRender();
  }
  renderPill();
}
function softRender(){
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'file' && a.closest && a.closest('#app')){ clearTimeout(CL.rt); CL.rt = setTimeout(softRender, 2500); return; }
  render();
}

function cloudPush(){
  if(!CL.db || CL.readonly) return;
  if(!CL.ready){ CL.want = true; return; }
  CL.dirty = true; clearTimeout(CL.timer); CL.timer = setTimeout(flush, 500);
}
async function flush(){
  if(CL.flushing){ CL.again = true; return; }
  CL.flushing = true; const db = CL.db;
  try{
    ensureIds();
    const docs = clDocs();
    for(const p of Object.keys(docs)){ const s = ss(docs[p]); if(s !== CL.last[p]){ await db.doc(p).set(JSON.parse(s)); CL.last[p] = s; CL.snap[p] = JSON.parse(s); } }
    // master file (chunks first, meta last, so readers never see half of it)
    const ms = ss(clMasterObj());
    if(S.mHeader.length && ms !== CL.last.master){
      const rev = rid(), n = Math.max(1, Math.ceil(S.mBase.length / CHUNK));
      for(let i = 0; i < n; i++) await db.doc('masterrows/c' + String(i).padStart(3, '0')).set({rev, i, rows:S.mBase.slice(i * CHUNK, (i + 1) * CHUNK)});
      await db.doc('master/meta').set({rev, n, header:S.mHeader, excl:S.exclAoa, meta:S.mMeta || null});
      for(let i = n; i < (CL.nChunks || 0); i++) await db.doc('masterrows/c' + String(i).padStart(3, '0')).delete();
      CL.last.master = ms; CL.nChunks = n;
      CL.snap['master/meta'] = {rev, n, header:S.mHeader, excl:S.exclAoa, meta:S.mMeta || null};
      CL.snap.masterrows = Array.from({length:n}, (_, i) => ({_id:'c' + String(i).padStart(3, '0'), rev, i, rows:S.mBase.slice(i * CHUNK, (i + 1) * CHUNK)}));
    }
    // lists: one document per row, so two people adding rows at the same time never overwrite each other
    const lists = Object.keys(CL_LISTS).map(k => [CL_LISTS[k], S.cfg[k], false]).concat([['added', S.mAdded, true]]);
    for(const [coll, arr, isAdded] of lists){
      const now = mapOf(arr, isAdded), prev = CL.last['list:' + coll] || {};
      for(const r of arr){ if(now[r._id] !== prev[r._id]){ const body = isAdded ? {vendor:r.vendor, raw:r.raw, by:r.by, at:r.at} : (({_id, ...rest}) => rest)(r); await db.doc(coll + '/' + r._id).set(JSON.parse(JSON.stringify(body))); } }
      for(const id of Object.keys(prev)) if(!(id in now)) await db.doc(coll + '/' + id).delete();
      CL.last['list:' + coll] = now;
      CL.snap[coll] = arr.map(r => isAdded ? {_id:r._id, vendor:r.vendor, raw:r.raw, by:r.by, at:r.at} : JSON.parse(JSON.stringify(r)));
    }
  }catch(e){
    if(e && e.code === 'invalid_argument'){ CL.readonly = true; toast('Your access level cannot change the shared files. What you upload here stays in this browser only.'); }
    else if(e && e.code === 'quota_exceeded'){ toast('The team storage is full. Ask the page owner to free some space.'); }
    else { CL.err = e; setTimeout(cloudPush, 8000); }
  }finally{
    CL.flushing = false; CL.dirty = false;
    if(CL.again){ CL.again = false; cloudPush(); } else if(CL.stale){ applyAll(false); }
    renderPill();
  }
}

const glList = () => S.coaSource==='upload' ? S.coa.map(e => e.full) : S.derived.gls;
const classList = () => { const s = S.classSource==='upload' ? S.classesUp.slice() : S.derived.classes.slice(); Object.values(S.cfg.classMap).forEach(c => { if(c && !s.includes(c)) s.push(c); }); return s.filter(c => !Engine.isRetiredClass(c)).sort((a,b) => a.localeCompare(b)); };

/* ---------- engine wiring ---------- */
const acctFor = f => { const a = ACCOUNTS[f.acctIdx]; return Object.assign({}, a, {bankClass: S.cfg.classOverrides[a.num] ?? a.bankClass}); };
function cfgAll(){
  return Object.assign({}, S.cfg, {master:S.master, excluded:S.excluded, coa: S.coaSource==='upload' ? S.coa : [], openBillsChecked: S.cfg.openBills.length>0 || S.cfg.noOpenBills});
}
function process(){
  S.txs = [];
  S.feeds.forEach((f, i) => { if(f.acctIdx >= 0){ const t = Engine.loadFeed(f.text, acctFor(f), 'f'+f.id, S.forced); f.count = t.length; S.txs.push(...t); } });
  S.results = Engine.run(S.txs, cfgAll());
  S.drafts = {}; S.acks = {}; S.signed = null; S.open = {};
}
function rerun(){
  const keep = new Map(S.results.map(r => [r.id, r.resolved]));
  S.txs = []; S.feeds.forEach(f => { if(f.acctIdx >= 0) S.txs.push(...Engine.loadFeed(f.text, acctFor(f), 'f'+f.id, S.forced)); });
  S.results = Engine.run(S.txs, cfgAll());
  S.results.forEach(r => r.resolved = keep.get(r.id) || null);
  const proposed = new Set(S.cfg.newVendorLog.filter(v => v.status==='proposed').map(v => Engine.norm(v.vendor)));
  S.results.forEach(r => { if((r.resolved && r.resolved.isNewVendor) || (r.lane!=='scope' && r.lane!=='bill' && proposed.has(Engine.norm(r.qboVendor||r.vendor||'')))) r.newVendor = true; });
  S.signed = null;
}
const ready = () => S.txs.length > 0;
const counts = () => { const c = {bill:0, old:0, new:0, exception:0, scope:0}; S.results.forEach(r => c[r.lane]++); return c; };
const waiting = () => S.results.filter(r => r.lane === 'new' && !Engine.isConfirmed(r));
const heldEx = () => S.results.filter(r => r.lane === 'exception' && !Engine.isConfirmed(r));
const batch = () => Engine.importRows(S.results);
const allFlags = () => Engine.checks(batch());
const conf = r => Engine.isConfirmed(r) && r.lane !== 'bill' && r.lane !== 'scope';
const noData = title => `<div class="pagehead"><div><h2>${title}</h2></div></div><div class="card empty"><b>No bank feed loaded yet.</b>Upload the day's CSV files first. Nothing from earlier sessions is kept, except the Vendor Master and your rules.<br><br><button class="btn primary" data-view="upload">Go to upload</button></div>`;

/* lists shown on the Results page and exported */
const LISTS = {
  all:{label:'All rows', f:r => true},
  bill:{label:'Bill Payments List', f:r => r.lane==='bill'},
  admin:{label:'Administrative Class Review List', f:r => (r.lane==='old' && !conf(r) && r.adminReview) || (conf(r) && Engine.isAdminClass(r.resolved.cls))},
  newvendor:{label:'New vendors', f:r => r.newVendor && r.lane!=='scope' && r.lane!=='bill'},
  old:{label:'Old Transactions, Ready for Import', f:r => r.lane==='old' && !conf(r)},
  new:{label:'New Transactions, Pending Confirmation', f:r => r.lane==='new' && !conf(r)},
  exception:{label:'Exception Queue', f:r => r.lane==='exception' && !conf(r)},
  steven:{label:'Steven personal, mirror JE', f:r => r.exKind==='steven' || r.steven || !!(r.resolved && r.resolved.personal)},
  transfers:{label:'Transfers & currency conversions', f:r => r.sub==='conversion' || r.sub==='transfer'},
  scope:{label:'Out of scope (payroll, transfers, conversions)', f:r => r.lane==='scope'}
};
const listRows = k => S.results.filter(LISTS[k].f);

/* ---------- top bar ---------- */
function renderSteps(){
  const w = waiting().length;
  const steps = [['upload','Upload'],['results','Results'],['resolve','Resolve'],['review','Review'],['export','Export']];
  $('#steps').innerHTML = steps.map(([k, l], i) => {
    const done = (k==='upload' && S.txs.length) || (k==='resolve' && S.txs.length && w===0) || (k==='review' && S.signed);
    return `<button class="step ${done?'done':''}" data-view="${k}" ${S.view===k?'aria-current="page"':''}><span class="n">${done?'✓':i+1}</span>${l}${k==='resolve'&&w?`<span class="badge">${w}</span>`:''}</button>`;
  }).join('');
  $('#dataBtn').style.borderColor = S.view==='data' ? 'var(--accent)' : '';
  $('#auditBtn').style.borderColor = S.view==='audit' ? 'var(--accent)' : '';
}

/* ---------- views ---------- */

  const m = S.master.length, br = S.cfg.openBills.length;
  const dot = (c, t, s, act) => `<div class="rd"><span class="dot ${c}"></span><span><b>${t}</b><div class="sub">${s}</div></span>${act||''}</div>`;
  return [
    m ? dot('ok', 'Vendor Master', `${m} vendors loaded${S.mMeta?' from '+esc(S.mMeta.file):''}. ${CL.db&&!CL.readonly?'Saved for the whole team.':'Remembered in this browser only.'}`)
      : dot('bad', 'Vendor Master', 'Not loaded. Every vendor will look new until you upload it.', '<button class="btn small primary" data-goto-data="master">Upload</button>'),
    S.coaSource==='upload' ? dot('ok', 'Chart of accounts', `${S.coa.length} accounts from your upload.`)
      : dot('warn', 'Chart of accounts', `Using ${S.derived.gls.length} account names found in the Vendor Master. Upload the full chart to get every account.`, '<button class="btn small" data-goto-data="coa">Upload</button>'),
    S.classSource==='upload' ? dot('ok', 'Classes', `${S.classesUp.length} classes from your upload.`)
      : dot('warn', 'Classes', `Using ${S.derived.classes.length} classes found in the Vendor Master. Upload the full list to get every class.`, '<button class="btn small" data-goto-data="classes">Upload</button>'),
    br ? dot(S.cfg.billsAt===today()?'ok':'warn', 'Open bills', `${br} open bills${S.cfg.billsAt?' loaded '+esc(S.cfg.billsAt):''}${S.cfg.billsAt===today()?'':'. Not from today, refresh them.'}`, '<button class="btn small" data-goto-data="bills">Refresh</button>')
      : S.cfg.noOpenBills ? dot('ok', 'Open bills', 'You confirmed there are no open bills.', '<button class="btn small" data-goto-data="bills">Change</button>')
      : dot('warn', 'Open bills', 'Not loaded. Vendors that had bills in the last 90 days are held, because a bill payment cannot be ruled out.', '<button class="btn small" data-goto-data="bills">Upload</button>')
  ].join('');
}
function vUpload(){
  const feeds = S.feeds.map(f => `<div class="feed"><div><b>${esc(f.name)}</b><div class="sub">${f.count!=null && f.acctIdx>=0 ? f.count+' transactions' : 'Choose the account'}</div></div>
    <label class="f">Account this file came from<select data-feed-acct="${f.id}"><option value="-1">Choose account</option>${ACCOUNTS.map((a,i)=>`<option value="${i}" ${f.acctIdx===i?'selected':''}>${esc(a.num+' '+a.name)}</option>`).join('')}</select></label>
    <button class="btn small ghost" data-feed-del="${f.id}">Remove</button></div>`).join('');

  <div class="pagehead"><div><h2>Upload the bank feed</h2><p>Add one CSV per account. They are combined into one working file (SOP step 1). Everything runs in your browser.</p></div></div>

    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h3 style="font-size:16px">Bank feed files</h3>
      <label class="drop" id="drop"><b>Drop files here</b><span class="sub">or click to choose. Columns: Date, DESCRIPTION, Payee, Categorize or match, Class, SPENT, RECEIVED</span><input type="file" id="file" accept=".csv,text/csv" multiple hidden></label>
      <div>${feeds || '<div class="sub">No files yet.</div>'}</div>
      <div class="row"><button class="btn primary" id="processBtn" ${can?'':'disabled'}>Process ${S.feeds.length||''} file${S.feeds.length===1?'':'s'}</button>${S.feeds.length && !can?'<span class="sub">Choose an account for every file.</span>':''}</div>

    <div class="card"><h3 style="font-size:16px;margin-bottom:6px">Before you process</h3><div class="ready">${readinessRows()}</div></div>
  </div>`;

function chipsFor(r){
  return `${r.newVendor?'<span class="mini newv">New vendor</span> ':''}${r.steven?'<span class="mini lim">Steven personal</span> ':''}${r.tier?`<span class="mini lim">Tier ${esc(r.tier)}</span> `:''}${r.limited?'<span class="mini lim">Limited history</span> ':''}`;
}
function vResults(){
  if(!ready()) return noData('What the automation did');
  const c = counts();
  const t = (k, sub) => `<button class="tile l-${k}" data-filter="${k}" aria-pressed="${S.filter===k}"><span class="big">${c[k]}</span><span class="lbl">${LANE[k]}</span><span class="sub">${sub}</span></button>`;
  const rows = listRows(S.filter);
  const body = rows.map(r => {
    const isC = conf(r); const f = isC ? r.resolved : r;
    const laneLabel = isC ? 'Confirmed' : LANE[r.lane]; const lane = isC ? 'old' : r.lane;
    const showAcct = (isC || r.lane==='old' || r.lane==='new') && f.gl;
    const admin = (r.lane==='old' && !isC && r.adminReview) || (isC && Engine.isAdminClass(f.cls));
    const acc = showAcct ? `${esc(f.gl)}<div class="sub">${esc(f.cls||'')} ${admin?'<span class="mini adm">Admin review</span>':''}</div>` : `<span class="sub">${r.exKind?esc(EXK[r.exKind]):'-'}</span>`;
    return `<tr class="clickable ${r.newVendor&&!isC?'newrow':''}" data-open="${r.id}"><td class="mono">${esc(r.dateRaw)}</td><td class="sub">${esc(r.account.num)}<br>${esc(r.account.cur)}</td><td class="ellip"><b>${esc(r.qboVendor||r.vendor||'(none)')}</b><div class="sub">${esc(r.desc)}</div><div>${chipsFor(r)}</div></td><td class="r num ${r.amount>0?'in':''}">${fmtR(r)}</td><td><span class="chip l-${lane}">${laneLabel}</span></td><td>${acc}</td></tr>
    ${S.open[r.id] ? `<tr class="why"><td></td><td colspan="5"><b>${esc(r.reason)}</b><ul>${r.trace.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.suggestedGL?`<div class="sub" style="margin-top:6px">QBO's own suggestion (not trusted): ${esc(r.suggestedGL)}</div>`:''}${r.lane==='scope'?`<div style="margin-top:8px"><button class="btn small" data-force="${r.id}">This is a normal transaction, categorise it</button></div>`:''}</td></tr>`:''}`;
  }).join('');
  const w = waiting().length, h = heldEx().length;
  const listChips = ['all','admin','newvendor','steven','transfers'].map(k => `<button data-filter="${k}" aria-pressed="${S.filter===k}">${LISTS[k].label}<span class="ct">${listRows(k).length}</span></button>`).join('');
  const billsWarn = !S.cfg.openBills.length && !S.cfg.noOpenBills ? `<div class="banner warn"><span><b>Open bills are not loaded.</b> Step 2 of the SOP cannot be completed for vendors that had bills in the last 90 days, so those rows are held.</span><button class="btn small" data-goto-data="bills">Load open bills</button></div>` : '';
  const mWarn = !S.master.length ? `<div class="banner warn"><span><b>The Vendor Master is not loaded.</b> Every vendor looks new.</span><button class="btn small" data-goto-data="master">Upload it</button></div>` : '';
  return `
  <div class="pagehead"><div><h2>What the automation did</h2><p>Every row went through the SOP order: open bills, bank rules, Vendor Master, email rules, then the class waterfall. Click a row to see why. Every list below is built automatically.</p></div>
    ${w||h ? `<button class="btn primary" data-view="resolve">Resolve ${w} row${w===1?'':'s'}</button>` : `<button class="btn primary" data-view="review">Go to review</button>`}</div>
  <div class="banner"><span><b>${S.feeds.length} file${S.feeds.length===1?'':'s'}</b> · ${S.txs.length} transactions · ${S.master.length} vendors in the Vendor Master</span><button class="btn small" data-view="upload">Upload different files</button></div>
  ${mWarn}${billsWarn}
  <div class="tiles">${t('bill','Pay Bills / Match in QBO')}${t('old','Straight into the import')}${t('new','Team member decides')}${t('exception','Held, not posted')}${t('scope','Payroll, transfers')}</div>
  <div class="lists">${listChips}</div>
  <div class="row" style="justify-content:space-between"><span class="sub">${esc(LISTS[S.filter].label)}: ${rows.length} row${rows.length===1?'':'s'}</span><div class="row">${S.filter!=='all'?'<button class="btn small ghost" data-filter="all">Clear filter</button>':''}<button class="btn small" data-save-list="${S.filter}" ${rows.length?'':'disabled'}>Save this list (CSV)</button></div></div>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>Acct</th><th>Vendor / description</th><th class="r">Amount</th><th>Lane</th><th>Account / class</th></tr></thead><tbody>${body||`<tr><td colspan="6" class="empty">No rows in this list.</td></tr>`}</tbody></table></div>`;
}

/* GL and class dropdowns */
const TYPE_ORDER = ['Expenses','Cost of Goods Sold','Income','Other Income','Other Expense','Bank','Credit Card','Other Current Liabilities','Long Term Liabilities','Accounts payable (A/P)','Other Current Assets','Fixed Assets','Other Assets','Accounts receivable (A/R)','Equity'];
function glGroups(list){
  if(S.coaSource!=='upload') return [['All accounts', list]];
  const by = new Map(S.coa.map(e => [e.full, e.type||'Other']));
  const g = {}; list.forEach(x => { const t = by.get(x) || 'Other'; (g[t] = g[t] || []).push(x); });
  const keys = Object.keys(g).sort((a,b) => { const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });
  return keys.map(k => [k, g[k]]);
}
function glSelect(id, value, extras){
  const list = glList();
  const sugg = [...new Set((extras||[]).filter(Boolean))];
  if(value && !list.includes(value) && !sugg.includes(value)) sugg.unshift(value);
  const opt = g => `<option value="${esc(g)}" ${g===value?'selected':''}>${esc(g)}</option>`;
  return `<select id="gl-${id}" data-d="${id}" data-k="gl"><option value="">Choose an account (${list.length} available)</option>${sugg.length?`<optgroup label="Suggested">${sugg.map(opt).join('')}</optgroup>`:''}${glGroups(list).map(([t,items]) => `<optgroup label="${esc(t)}">${items.map(opt).join('')}</optgroup>`).join('')}</select>`;
}
function clsSelect(id, value, allowOwner){
  const list = classList();
  return `<select data-d="${id}" data-k="cls"><option value="">Choose a class</option>${list.map(c=>{ const res = Engine.isReserved(c), own = Engine.isOwnerClass(c) && !allowOwner; return `<option value="${esc(c)}" ${c===value?'selected':''} ${res||own?'disabled':''}>${esc(c)}${res?' (reserved, Steven personal book)':own?' (not for Empire transactions)':''}</option>`; }).join('')}${value && !list.includes(value)?`<option value="${esc(value)}" selected>${esc(value)}</option>`:''}</select>`;
}
const payoutLocs = () => S.cfg.payoutLocations || Engine.DEFAULT_PAYOUT_LOCATIONS;
function payoutBlock(r, d){
  const o = r.payoutOptions || [], n = (S.cfg.payoutIndex||[]).length;
  if(!o.length) return `<div class="picks"><span class="lbl">${r.platform==='Xola' ? (n ? 'No Xola payout of this amount was found.' : 'No Xola payouts are loaded (Data &amp; rules, Xola payouts).') : 'Class cannot be read from the bank line.'} Administrative is the default. Change the class below if you know it.</span></div>`;
  const chips = o.map((x,i) => { const sel = x.personal ? d.personal : (!d.personal && d.cls && d.cls===x.cls); return `<button type="button" class="pick" aria-pressed="${sel?'true':'false'}" ${sel?'style="outline:2px solid var(--accent,#2563eb)"':''} data-pick-opt="${r.id}" data-i="${i}">${x.personal?'Steven personal book':esc(x.cls||'Class not in the SOP table')} <span class="sub">${esc(x.locs.map(l=>l.replace(/_/g,' ')).join(', '))}${x.dates.length?' · paid '+esc(x.dates.join(', ')):''}</span></button>`; }).join('');
  return `<div class="picks"><span class="lbl">${o.length>1?'Same amount in several Xola locations. Choose the class:':'Matching Xola payout:'}</span>${chips}</div>`;
}
function draftFor(r){
  if(!S.drafts[r.id]) S.drafts[r.id] = { vendor: r.qboVendor || r.vendor || r.platform || '', gl: r.gl || '', loc: (r.payoutOptions&&r.payoutOptions.length===1) ? r.payoutOptions[0].locs.join(', ') : '', personal: !!(r.payoutOptions&&r.payoutOptions.length===1&&r.payoutOptions[0].personal), cls: (r.cls && !/^run class/i.test(r.cls)) ? r.cls : (r.adminDefault ? (S.cfg.classMap.Administrative || Engine.DEFAULT_CLASS_MAP.Administrative) : r.pickClass ? '' : r.proposedClass) };
  return S.drafts[r.id];
}
function vResolve(){
  if(!ready()) return noData('Resolve');
  const list = S.results.filter(r => r.lane==='new' || r.lane==='exception' || conf(r));
  const actionable = list.filter(r => Engine.canConfirm(r) || conf(r));
  const done = actionable.filter(r => conf(r)).length;
  if(!list.length) return `<div class="pagehead"><div><h2>Resolve</h2></div></div><div class="card empty"><b>Nothing is waiting for a decision.</b>Every row was matched with confidence, sent to the bill list, or is out of scope.<br><br><button class="btn primary" data-view="review">Go to review</button></div>`;
  const member = `<div class="card row" style="justify-content:space-between"><label class="f" style="min-width:min(100%,260px)">Team member name<input type="text" id="member" value="${esc(S.member)}" placeholder="e.g. Arjun Kapoor"></label><span class="sub" style="max-width:56ch">Recorded in the Memo of every row you confirm. A new vendor you confirm is added to the Vendor Master and the New Vendor Log automatically.</span></div>`;
  const cards = list.map(r => {
    const ok = conf(r); const held = r.lane==='exception' && !Engine.canConfirm(r);
    const d = ok || held ? null : draftFor(r);
    const suggestGl = [r.suggestedGL, ...(r.suggestGls||[])].filter(Boolean);
    const head = `<div class="rc-head"><div style="min-width:0"><span class="chip l-${ok?'old':r.lane}">${ok?'Confirmed':(r.lane==='exception'&&r.exKind?EXK[r.exKind]:LANE[r.lane])}</span> ${chipsFor(r)}<div class="sub" style="margin-top:6px">${esc(r.dateRaw)} · ${esc(r.account.num)} · ${esc(r.desc)}</div></div><div class="amt num ${r.amount>0?'in':''}">${fmtR(r)}</div></div>`;
    let body;
    if(held) body = `<div class="sub"><b>Held.</b> Only the Reviewer and Jonathan can release this row. It stays out of the import file.${r.exKind==='steven'?' It also appears on the Steven personal mirror JE list.':''}</div>`;
    else if(ok) body = `<div class="row"><span><b>${esc(r.resolved.vendor)}</b> → ${esc(r.resolved.gl)} · ${esc(r.resolved.cls)}${r.resolved.loc?` · <span class="sub">${esc(r.resolved.loc.replace(/_/g,' '))}</span>`:''}</span><button class="btn small ghost" data-undo="${r.id}">Undo</button></div>`;
    else {
      const sim = (r.suggest||[]).map((s,i) => `<button class="pick" data-pick-vendor="${r.id}" data-i="${i}">${esc(s.vendor)} <span class="sub">tier ${esc(s.tier)}</span></button>`).join('');
      const gls = suggestGl.map((g,i) => `<button class="pick" data-pick-gl="${r.id}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
      body = `${sim?`<div class="picks"><span class="lbl">Existing vendors that may match:</span>${sim}</div>`:''}
      ${r.payout?payoutBlock(r,d):''}
      <div class="two"><label class="f">Vendor (exact QBO name)<input type="text" list="vlist" data-d="${r.id}" data-k="vendor" value="${esc(d.vendor)}"><span class="hint">${r.account.cur==='GBP'?'Wise GBP vendors end in _G.':r.account.cur==='EUR'?'Euro vendors end in _E.':'Use the name exactly as in QBO.'}</span></label>
      <label class="f">Class${clsSelect(r.id, d.cls, r.steven)}<span class="hint">${r.proposedWhy?'Proposed from '+esc(r.proposedWhy):''}</span></label></div>
      <label class="f">GL account<div class="glrow"><input type="search" placeholder="Filter accounts" data-filter-gl="${r.id}">${glSelect(r.id, d.gl, suggestGl)}</div></label>
      ${gls?`<div class="picks"><span class="lbl">${r.suggestGls&&r.suggestGls.length?'Accounts this vendor has used:':'QBO suggested:'}</span>${gls}</div>`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn primary" data-confirm="${r.id}">Confirm</button></div>`;
    }
    return `<div class="card rc ${ok?'done':''} ${r.newVendor&&!ok?'isnew':''}" data-card="${r.id}">${head}<div class="whybox">${esc(r.reason)}</div>${body}</div>`;
  }).join('');
  return `
  <div class="pagehead"><div><h2>Resolve what the rules could not</h2><p>Identify the real vendor, choose the account and class from the full lists, then confirm. Nothing is guessed: rows you do not confirm stay out of the import.</p></div><div class="row"><progress max="${actionable.length||1}" value="${done}"></progress><span class="sub num">${done} of ${actionable.length} confirmed</span></div></div>
  ${member}
  <div class="rcards">${cards}</div>
  <datalist id="vlist">${S.master.map(m=>`<option value="${esc(m.vendor)}">`).join('')}</datalist>
  ${actionable.length && done===actionable.length?`<div class="row"><button class="btn primary" data-view="review">Continue to review</button></div>`:''}`;
}

function vReview(){
  if(!ready()) return noData('Reviewer checks and sign-off');
  const rows = batch(), flags = allFlags(), w = waiting().length;
  const spent = {}, recv = {};
  rows.forEach(r => { const o = r.amount<0?spent:recv; o[r.cur] = (o[r.cur]||0) + r.amount; });
  const sums = o => Object.entries(o).map(([c,v]) => fmt(v, SYM[c]||'')).join(' · ') || '0.00';
  const unacked = flags.filter(f => !S.acks[f.id]).length;
  const can = w===0 && unacked===0 && S.reviewer.trim() && rows.length;
  const newV = S.results.filter(r => r.newVendor && r.lane!=='scope' && r.lane!=='bill');
  const seen = new Set(); const nvRows = newV.filter(r => { const k = Engine.baseKey(conf(r)?r.resolved.vendor:r.vendor); if(seen.has(k)) return false; seen.add(k); return true; });
  const nv = nvRows.length ? `<div class="card" style="border-color:var(--accent)"><h3 style="font-size:16px;margin-bottom:8px">New vendors in these files <span class="mini newv">${nvRows.length}</span></h3><div class="tablewrap"><table><thead><tr><th>Vendor</th><th>Proposed account</th><th>Proposed class</th><th>Status</th></tr></thead><tbody>${nvRows.map(r => { const c = conf(r); return `<tr><td><b>${esc(c?r.resolved.vendor:r.vendor)}</b><div class="sub">${esc(r.desc)}</div></td><td>${c?esc(r.resolved.gl):'<span class="sub">not decided</span>'}</td><td>${c?esc(r.resolved.cls):'<span class="sub">not decided</span>'}</td><td>${c?'<span class="chip l-old">Added to Vendor Master and New Vendor Log</span>':'<span class="chip l-new">Waiting for a decision</span>'}</td></tr>`; }).join('')}</tbody></table></div><p class="sub" style="margin:8px 0 0">The Reviewer approves the New Vendor Log here. It stays "proposed" until it goes in the weekly send to Jonathan and is not challenged.</p></div>` : '';
  const fl = flags.length ? flags.map(f => `<div class="flag"><label class="check"><input type="checkbox" data-ack="${esc(f.id)}" ${S.acks[f.id]?'checked':''}></label><div><span class="kind sev-${f.severity}">${esc(f.kind)}</span><div><b>${esc(f.title)}</b></div><div class="sub">${esc(f.detail)}</div></div></div>`).join('') : `<div class="empty"><b>No flags.</b>No duplicates, inconsistent vendors, missing vendors or invalid classes in this batch.</div>`;
  const admN = listRows('admin').length;
  return `
  <div class="pagehead"><div><h2>Reviewer checks and sign-off</h2><p>The section 8 checks run on the combined Old plus confirmed batch. This is the one hard gate: tick each flag once you have judged it, then sign off.</p></div></div>
  <div class="card pop"><div class="stat"><div><span class="sub">Rows in import</span><b class="num">${rows.length}</b></div><div><span class="sub">Money out</span><b class="num">${sums(spent)}</b></div><div><span class="sub">Money in</span><b class="num">${sums(recv)}</b></div><div><span class="sub">Held in exceptions</span><b class="num">${heldEx().length}</b></div><div><span class="sub">Admin class review</span><b class="num">${admN}</b></div><div><span class="sub">New vendors</span><b class="num">${nvRows.length}</b></div></div></div>
  ${w?`<div class="banner"><span><b>${w} row${w===1?'':'s'}</b> still need a decision before sign-off.</span><button class="btn" data-view="resolve">Resolve now</button></div>`:''}
  ${nv}
  <div class="card"><h3 style="font-size:16px">Flags for the reviewer ${flags.length?`<span class="tag">${flags.length - unacked} of ${flags.length} reviewed</span>`:''}</h3>${fl}</div>
  <div class="card ${S.signed?'':'pop'}">${S.signed ? `<div class="row" style="justify-content:space-between"><span><span class="chip l-old">Signed off</span> by <b>${esc(S.signed.by)}</b> · ${esc(S.signed.at)}</span><button class="btn small" data-view="export">Go to export</button></div>` : `
    <div class="signoff"><label class="f">Reviewer name<input type="text" id="reviewer" value="${esc(S.reviewer)}" placeholder="e.g. Meera Iyer"></label><button class="btn primary" id="signBtn" ${can?'':'disabled'}>Sign off batch</button><span class="sub">${!rows.length?'No rows to import.':w?'Resolve all new rows first.':unacked?unacked+' flag(s) still to review.':!S.reviewer.trim()?'Enter the reviewer name.':'Ready. No row can be added after sign-off without repeating this step.'}</span></div>`}</div>`;
}

const AUD = {ok:['Matches','old'], diff:['Different','exception'], rule:['Rule issue','new'], unknown:['Cannot verify','bill'], scope:['Out of scope','scope']};
function runAudit(){
  const A = S.audit; A.err = ''; A.rows = null;
  if(!A.text || A.acctIdx < 0) return;
  if(!S.master.length){ A.err = 'Load the Vendor Master first (Data & rules). The check compares the file with it.'; return; }
  try{ A.rows = Engine.audit(A.text, acctFor({acctIdx:A.acctIdx}), cfgAll(), 'a'); if(!A.rows.length) A.err = 'No transactions found. The file needs Date, DESCRIPTION, Payee and AMOUNT (or SPENT / RECEIVED) columns.'; }
  catch(e){ A.err = 'That file could not be read: ' + (e.message || e); A.rows = null; }
}
function vAudit(){
  const A = S.audit, rows = A.rows || [];

    <td>${r.status==='scope'||r.status==='unknown' ? '<span class="sub">' + esc(LANE[r.sop.lane] || r.sop.lane) + '</span>' : esc(r.sop.gl || LANE[r.sop.lane] || '')}<div class="sub">${esc(r.sop.cls || '')}</div></td>
    <td><span class="tag l-${AUD[r.status][1]}">${esc(r.label)}</span><div class="sub">${esc(r.why.slice(0, 220))}</div></td></tr>`).join('');

    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Payee</th><th class="r">Amount</th><th>In the file</th><th>SOP says</th><th>Result</th></tr></thead><tbody>${lines || '<tr><td colspan="6" class="empty">Nothing in this group.</td></tr>'}</tbody></table></div>
    ${shown.length > 400 ? `<div class="sub">Showing the first 400 of ${shown.length}. The Excel report has every row.</div>` : ''}` : '';
  return `
  <div class="pagehead"><div><h2>Check an older categorised file</h2><p>Upload a file that was categorised by hand (for example a QuickBooks bank feed export that shows what each line was added or matched to). Each line is run through the SOP and compared with what the file has. Nothing is posted, imported or changed.</p></div></div>

    <div class="row">

      <label class="f" style="min-width:260px">Account this file came from<select data-audit-acct="1"><option value="-1">Choose account</option>${ACCOUNTS.map((a,i)=>`<option value="${i}" ${A.acctIdx===i?'selected':''}>${esc(a.num+' '+a.name)}</option>`).join('')}</select><span class="hint">Used for the bank-account class rule.</span></label>
    </div>

function auditReport(){
  const A = S.audit, rows = A.rows || [];

/* The Vendor Master workbook carries Jonathan's email rules (in the GL / Notes text, e.g. "(Jonathan 9/25)") and the
   bank-rule flag (the "Auto-match / Bank rule?" column). They are listed read-only in their tabs so the team can check them. */
function emailRulesFromMaster(){
  const now = new Date(), yr = now.getFullYear(), mo = now.getMonth() + 1, out = [];
  S.master.forEach(m => {
    if(m.src === 'new') return;
    const parts = [m.gl, m.howTo, m.notes].join(';').split(';').map(x => x.trim()).filter(Boolean);
    const seg = parts.filter(x => /Jonathan\s+\d{1,2}\/\d{1,2}/i.test(x)); if(!seg.length) return;
    const d = seg[0].match(/Jonathan\s+(\d{1,2})\/(\d{1,2})/i); const mm = +d[1], dd = +d[2];
    out.push({vendor:m.vendor, gl:m.gl, cls:m.cls, date:`${mm > mo ? yr - 1 : yr}-${pad2(mm)}-${pad2(dd)}`, note:seg.join('; ')});
  });
  return out.sort((a, b) => b.date.localeCompare(a.date) || a.vendor.localeCompare(b.vendor));
}
function bankRulesFromMaster(){
  return S.master.filter(m => m.src !== 'new' && /^(yes|gl only)/i.test(m.autoMatch || '')).map(m => ({vendor:m.vendor, gl:m.gl, cls:m.cls, status:m.autoMatch, tier:m.tier}));
}
function masterRuleSection(tab){
  if(!S.master.length) return '<div class="empty"><b>No Vendor Master loaded.</b>Upload it above to see the rules it contains.</div>';
  const isE = tab === 'emailRules', all = isE ? emailRulesFromMaster() : bankRulesFromMaster();
  const q = Engine.norm(S.rSearch), rows = all.filter(r => !q || Engine.norm(r.vendor).includes(q) || Engine.norm(r.gl).includes(q) || Engine.norm(r.cls).includes(q) || Engine.norm(r.note || r.status || '').includes(q));
  const head = isE ? '<th>Vendor</th><th>GL account</th><th>Class</th><th>Email date</th><th>Instruction (from the Vendor Master)</th>' : '<th>Vendor</th><th>GL account</th><th>Class</th><th>Bank rule / auto-match</th><th>Tier</th>';
  const body = rows.map(r => isE ? `<tr><td>${esc(r.vendor)}</td><td>${esc(r.gl)}</td><td>${esc(r.cls)}</td><td>${esc(showDate(r.date))}</td><td class="sub">${esc(r.note)}</td></tr>` : `<tr><td>${esc(r.vendor)}</td><td>${esc(r.gl)}</td><td>${esc(r.cls)}</td><td>${esc(r.status)}</td><td><span class="tag">${esc((r.tier||'').split('.')[0])}</span></td></tr>`).join('');
  const sub = isE ? 'Jonathan\'s instructions already built into the Vendor Master. Read-only here; to change one, edit the Vendor Master or add a newer dated row above (a newer row wins).' : 'Vendors the Vendor Master marks for a bank rule / auto-match ("Yes", "Yes - limited history" = fewer than 3 past transactions, "GL only" = GL fixed, class from the waterfall). Read-only here; vendors marked "No" are not listed.';
  return `<h3 style="font-size:15px;margin:6px 0 0">From the Vendor Master (${all.length})</h3><p class="sub" style="margin:0">${sub}</p>
    <div class="row"><label class="f" style="flex:1;min-width:220px">Search<input type="search" id="rSearch" value="${esc(S.rSearch)}" placeholder="Vendor, account or class"></label><span class="sub">${rows.length} shown</span></div>
    <div class="tablewrap" style="max-height:480px;overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="5" class="empty">No match.</td></tr>'}</tbody></table></div>`;
}

const readText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(f); });
const readBuf = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(f); });
async function readSheets(f){
  if(/\.csv$/i.test(f.name)) return {sheets:{[f.name]: Engine.parseCSV(await readText(f))}, names:[f.name]};
  if(typeof XLSX === 'undefined') throw new Error('Excel reading is not available in this view. Save the sheet as CSV and upload that.');
  const wb = XLSX.read(await readBuf(f), {type:'array'});
  const sheets = {}; wb.SheetNames.forEach(n => sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''}));
  return {sheets, names:wb.SheetNames};
}
function headerRow(aoa, needles){
  for(let i = 0; i < Math.min(aoa.length, 30); i++){
    const cells = aoa[i].map(c => String(c).toLowerCase());
    if(needles.every(n => cells.some(c => c.includes(n)))) return i;
  }
  return -1;
}
const colIx = (H, ...names) => { for(const n of names){ const i = H.findIndex(h => h === n); if(i >= 0) return i; } for(const n of names){ const i = H.findIndex(h => h.includes(n)); if(i >= 0) return i; } return -1; };

const pad2 = n => String(n).padStart(2, '0');
function normDate(v){
  if(v == null || v === '') return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if(typeof v === 'number'){ if(v > 20000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5).toISOString().slice(0, 10); return ''; }
  const t = String(v).trim(); let m;
  if(!t) return '';
  if(m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  if(m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)){ let y = +m[3]; if(y < 100) y += 2000; return `${y}-${pad2(m[1])}-${pad2(m[2])}`; }
  const p = Date.parse(t + ' UTC'); return isNaN(p) ? '' : new Date(p).toISOString().slice(0, 10);
}
const showDate = iso => { const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[2]}/${m[3]}/${m[1]}` : String(iso||''); };
async function importBills(f){
  const {sheets, names} = await readSheets(f); const aoa = sheets[names[0]];
  const out = [];
  const BK = /^(current|\d+\s*-\s*\d+|\d+\s*(and|\+)\s*over|\d+\s*\+)$/i;
  const ag = aoa.findIndex(r => r.some(c => /^current$/i.test(String(c).trim())) && r.some(c => /^1\s*-\s*30$/.test(String(c).trim())));
  if(ag >= 0){
    /* A/P Aging Summary: one row per vendor, one column per age bucket. The report carries no bill dates or numbers,
       so each bucket and the vendor total become open-balance entries; the due-date window is worked out from the
       "As of" date and the bucket so the team can still see how old the balance is. */
    let asOf = null;
    aoa.slice(0, ag).forEach(r => r.forEach(c => { const m = String(c).match(/^as of\s+(.+)$/i); if(m){ const t = Date.parse(m[1].trim() + ' UTC'); if(!isNaN(t)) asOf = t; } }));
    const fmt = t => { const d = new Date(t); return `${pad2(d.getUTCMonth()+1)}/${pad2(d.getUTCDate())}/${d.getUTCFullYear()}`; };
    const win = h => {
      if(asOf == null) return '';
      let m;
      if(/^current$/i.test(h)) return `due ${fmt(asOf)} or later`;
      if(m = h.match(/^(\d+)\s*-\s*(\d+)$/)) return `due ${fmt(asOf - m[2]*864e5)} to ${fmt(asOf - m[1]*864e5)}`;
      if(m = h.match(/^(\d+)/)) return `due ${fmt(asOf - m[1]*864e5)} or earlier`;
      return '';
    };
    const H = aoa[ag].map(c => String(c).trim());
    const bIx = H.map((h,i) => /^(current|\d+\s*-\s*\d+|\d+\s*and over)$/i.test(h) ? i : -1).filter(i => i >= 0);
    aoa.slice(ag + 1).forEach(r => {
      const v = String(r[0] || '').trim(); if(!v || /^total/i.test(v) || /GMT[+-]\d/.test(v)) return;
      let total = 0;
      bIx.forEach(i => { const a = Engine.money(r[i]); if(a){ total += a; const w = win(H[i]); out.push({vendor:v, amount:a, date:'', bucket:H[i] + (/^\d+\s*-\s*\d+$/.test(H[i])?' days':'') + (w ? ' (' + w + ')' : ''), no:''}); } });
      total = Math.round(total * 100) / 100;
      if(total && out.filter(o => o.vendor===v).length > 1) out.push({vendor:v, amount:total, date:'', bucket:'total', total:true, no:''});
    });
  } else {
    /* A/P Aging Detail (or any bill list): one line per bill, with its bill date, due date and number.
       QuickBooks groups the lines under age headings ("1 - 30", "Total for 1 - 30"): remember the heading as the bucket. */
    const h = aoa.findIndex((r, i) => i < 40 && r.some(c => /^vendor( name)?$/i.test(String(c).trim())) && r.some(c => /(open balance|balance|amount)/i.test(String(c))));
    if(h < 0) throw new Error('Could not find a Vendor column or an A/P aging layout.');
    const H = aoa[h].map(x => String(x).toLowerCase().trim());
    const iV = H.findIndex(x => /^vendor( name)?$/.test(x)), iA = colIx(H, 'open balance', 'balance', 'amount');
    let iB = H.findIndex(x => x === 'date' || x === 'bill date' || x === 'transaction date'); const iD = H.findIndex(x => x === 'due date');
    if(iB < 0) iB = iD;
    const iN = colIx(H, 'num', 'bill no', 'ref');
    let bucket = '';
    aoa.slice(h + 1).forEach(r => {
      const first = String(r[0] || '').trim(), rest = r.slice(1).every(c => String(c).trim() === '');
      if(rest && BK.test(first)){ bucket = first + (/^\d+\s*-\s*\d+$/.test(first) ? ' days' : ''); return; }
      const v = String(r[iV] || '').trim(); const a = Engine.money(r[iA]);
      if(!v || !a || /^total/i.test(v) || /^total/i.test(first)) return;
      out.push({vendor:v, amount:a, date:normDate(iB >= 0 ? r[iB] : '') || normDate(iD >= 0 ? r[iD] : ''), bucket, no:iN >= 0 ? String(r[iN]||'') : ''});
    });
  }
  if(!out.length) throw new Error('No open bills found.');
  S.cfg.openBills = out; S.cfg.noOpenBills = false; S.cfg.billsAt = today(); saveAll(); rerun(); toast(`Open bills loaded: ${new Set(out.map(o=>o.vendor)).size} vendors`);
}

const prune = list => { const cut = new Date(Date.now() - 150*864e5).toISOString().slice(0,10); return list.filter(x => !x.date || x.date >= cut); };
function mergePayouts(entries, src){
  const k = x => Engine.normLoc(x.loc)+'|'+x.date+'|'+(Math.round(x.net*100)/100);
  const m = new Map((S.cfg.payoutIndex||[]).map(x => [k(x), x]));
  entries.forEach(e => m.set(k(e), {loc:e.loc, date:e.date, net:Math.round(e.net*100)/100, src}));
  S.cfg.payoutIndex = prune([...m.values()]).sort((a,b) => (b.date||'').localeCompare(a.date||'') || a.loc.localeCompare(b.loc));
  saveAll(); rerun();
}
async function importXola(files){
  let n = 0; const bad = [];
  for(const f of files){
    try{
      const {sheets, names} = await readSheets(f);
      let aoa = null, h = -1;
      for(const n of names){ const a = sheets[n]; const i = a.findIndex((r,k) => k < 40 && r.some(c => /^net$/i.test(String(c).trim())) && r.some(c => /payout date/i.test(String(c)))); if(i >= 0){ aoa = a; h = i; break; } }   // the Excel export has several tabs (Report Details, Summary, Transactions)
      if(!aoa){ bad.push(f.name + ': no Net and Payout Date columns'); continue; }
      const H = aoa[h].map(x => String(x).trim().toLowerCase()); const iN = H.indexOf('net'), iD = H.findIndex(x => /payout date/.test(x));
      let company = ''; for(const n of names){ const row = (sheets[n]||[]).slice(0,30).find(r => /^company$/i.test(String(r[0]).trim()) && String(r[1]||'').trim()); if(row){ company = String(row[1]).trim(); break; } }
      const loc = company || f.name.replace(/\.[a-z0-9]+$/i,'').replace(/payouts?|report/ig,' ').replace(/\d{4}[-_]\d{2}[-_]\d{2}|\d{1,2}[-_]\d{1,2}[-_]\d{2,4}/g,' ').replace(/[_\s-]+/g,' ').trim();
      const g = new Map();
      aoa.slice(h+1).forEach(r => { const d = normDate(r[iD]); const a = Engine.money(r[iN]); if(!d || !a) return; g.set(d, (g.get(d)||0) + a); });
      if(!g.size){ bad.push(f.name + ': no payout rows'); continue; }
      const found = Engine.findLoc(loc, S.cfg);
      mergePayouts([...g].map(([date, net]) => ({loc: found ? found.name : loc.replace(/\s+/g,'_'), date, net})), 'report');
      n += g.size;
    }catch(e){ bad.push(f.name + ': ' + (e.message||'could not be read')); }
  }
  S.dataTab = 'payoutIndex';
  toast(n ? `Xola payouts loaded: ${n} payout${n===1?'':'s'}.${bad.length?' Skipped: '+bad.join('; '):''}` : (bad.join('; ') || 'No payouts found.'));
}

async function importPayroll(f){
  const {sheets, names} = await readSheets(f);
  const classes = classList(), byLast = {};
  classes.forEach(c => { const l = Engine.norm(c.split(':').pop()); (byLast[l] = byLast[l] || []).push(c); });
  const toClass = raw => {
    const v = String(raw||'').trim(); if(!v) return '';
    const tries = [v, v.replace(/\s+tours?$/i, ''), v.replace(/\s+tours?$/i, '').replace(/^dc$/i, 'Washington DC')];
    for(const t of tries){ const n = Engine.norm(t); const ex = classes.find(c => Engine.norm(c) === n); if(ex) return ex; const l = byLast[n]; if(l && l.length === 1) return l[0]; }
    return '';
  };
  const NAME = /^(employee|name|payee|vendor|person|staff)( name)?$/, CLS = /^(class|location|department|entity|team|job)$/;
  const rows = []; let skipped = 0; const unknownJobs = {};
  names.forEach(sn => {
    const aoa = sheets[sn];
    const low = r => r.map(c => String(c).trim().toLowerCase());
    const h = aoa.findIndex(r => { const L = low(r); return L.some(c => CLS.test(c)) && (L.some(c => NAME.test(c)) || (L.includes('first name') && L.includes('last name'))); });
    if(h < 0) return;
    const H = low(aoa[h]);
    const iN = H.findIndex(x => NAME.test(x)), iF = H.indexOf('first name'), iL = H.indexOf('last name'), iC = H.findIndex(x => CLS.test(x));
    aoa.slice(h + 1).forEach(r => {
      const n = (iN >= 0 ? String(r[iN]||'') : (String(r[iF]||'') + ' ' + String(r[iL]||''))).replace(/\s+/g, ' ').trim(); if(!n) return;
      const raw = String(r[iC]||'').trim(); if(!raw) return;          // no job/class on the line = not paid this period
      const c = toClass(raw); if(c) rows.push({name:n, cls:c}); else { skipped++; unknownJobs[raw] = (unknownJobs[raw]||0) + 1; }
    });
  });
  if(!rows.length) throw new Error('Could not find a Name (or First name + Last name) column together with a Class / Job column whose values match the class list. Please send this file so it can be matched.');
  const by = new Map(), conflict = new Set();
  rows.forEach(x => { const k = Engine.norm(x.name), p = by.get(k); if(p && p.cls !== x.cls) conflict.add(k); else by.set(k, x); });
  conflict.forEach(k => by.delete(k));
  S.cfg.payrollMap = [...by.values()].map(x => Object.assign({_id:rid()}, x));
  saveAll(); rerun();
  const notes = [];
  if(skipped) notes.push(`${skipped} line(s) skipped: ${Object.entries(unknownJobs).map(([k, v]) => `"${k}" (${v})`).join(', ')} is not in the class list`);
  if(conflict.size) notes.push(`${conflict.size} person(s) on two different classes were left out`);
  toast(`Payroll classes loaded: ${S.cfg.payrollMap.length} employees${notes.length ? '. ' + notes.join('; ') : ''}`);
}
async function importTable(tab, f){
  const {sheets, names} = await readSheets(f); const aoa = sheets[names[0]]; if(!aoa.length) throw new Error('The file is empty.');
  const T = TABLES[tab]; const H = aoa[0].map(x => String(x).toLowerCase().trim());
  const map = T.cols.map(([k, label]) => [k, colIx(H, label.toLowerCase(), k)]);
  let n = 0;
  aoa.slice(1).forEach(r => { const row = Object.assign({}, T.blank); map.forEach(([k, i]) => { if(i >= 0) row[k] = String(r[i] == null ? '' : r[i]).trim(); }); if(Object.values(row).some(v => v)) { S.cfg[tab].push(row); n++; } });
  saveAll(); rerun(); toast(`${n} rows imported`);
}
async function addFeeds(files){
  for(const f of files){ S.feeds.push({id:S.nextFeed++, name:f.name, text:await readText(f), acctIdx:-1, count:null}); }

}
async function doImport(fn, input){
  const f = input.files[0]; if(!f) return;

  input.value = ''; render();
}

/* ---------- saving files ---------- */
async function saveFile(name, data){
  try{ if(S.dl){ await S.dl.save({filename:name, data}); toast('Saved '+name); return; } }
  catch(e){ if(e && e.code==='declined') return; }
  if(!S.dl){ try{ const blob = new Blob([data], {type: typeof data === 'string' ? 'text/csv;charset=utf-8' : 'application/octet-stream'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved ' + name); return; }catch(e){} }
  if(typeof data === 'string'){
    try{ await navigator.clipboard.writeText(data); toast('Saving is unavailable here. The file contents were copied instead.'); return; }catch(e){}
  }
  toast('Could not save this file here.');
}
async function copyText(text, ok){ try{ await navigator.clipboard.writeText(text); toast(ok); }catch(e){ toast('Copy is blocked in this view.'); } }

function doExport(k){
  const d = stamp();
  if(k==='importExp' || k==='importDep'){
    const sh = Engine.saasantSheets(batch());
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(k==='importExp' ? sh.expenses : sh.deposits, {cellDates:true});

    for(let i = 1; i < (k==='importExp' ? sh.expenses : sh.deposits).length; i++){ const c = ws[XLSX.utils.encode_cell({r:i, c:dcol})]; if(c && c.t==='d') c.z = 'mm/dd/yyyy'; }
    XLSX.utils.book_append_sheet(wb, ws, k==='importExp' ? 'Expenses' : 'Deposits');
    try{ const buf = XLSX.write(wb, {bookType:'xlsx', type:'array', cellDates:true}); return saveFile((k==='importExp'?'SaasAnt_Expenses_':'SaasAnt_Deposits_')+d+'.xlsx', buf); }catch(e){ return toast('Excel writing is not available in this view.'); }
  }
  if(k==='combined') return saveFile('Combined_Pre-Import_Batch_'+d+'.csv', Engine.toCSV([['Date','Account','Vendor','Description','Amount','GL account','Class','Source','Admin review','New vendor','Limited history']].concat(batch().map(r => [r.dateRaw, r.account, r.vendor, r.desc, r.amount.toFixed(2), r.gl, r.cls, r.memo, r.adminReview?'Yes':'', r.newVendor?'Yes':'', r.limited?'Yes':'']))));
  if(k==='newvendor') return saveFile('New_Vendor_Log_'+d+'.csv', Engine.toCSV([['Vendor','Proposed GL','Proposed class','Coded on','Coded by','Status']].concat(S.cfg.newVendorLog.map(v => [v.vendor, v.gl, v.cls, v.date, v.by, v.status]))));
  if(k==='steven') return saveFile('Steven_Personal_Mirror_JE_'+d+'.csv', stevenCSV());
  if(k==='master'){ try{ return saveFile('Empire_Vendor_Master_updated_'+d+'.xlsx', masterWorkbook()); }catch(e){ return toast('Excel writing is not available in this view.'); } }
  const names = {old:'Old_Transactions_Ready_for_Import', new:'New_Transactions_Pending_Confirmation', bill:'Bill_Payments_List', admin:'Administrative_Class_Review_List', exception:'Exception_Queue', transfers:'Transfers_and_Conversions', scope:'Out_of_Scope', all:'All_Rows'};
  return saveFile((names[k]||k)+'_'+d+'.csv', listCSV(k));
}
function weeklyNote(){
  const rows = batch(); const L = ['Weekly categorisation update', ''];
  L.push('New Vendor Log (proposed account and class, please confirm or correct):');
  const nv = S.cfg.newVendorLog.filter(v => v.status==='proposed'); nv.length ? nv.forEach(v => L.push(`- ${v.vendor}: ${v.gl} / ${v.cls} (coded ${v.date})`)) : L.push('- none');

function confirmRow(id){
  const r = S.results.find(x => x.id===id), dr = S.drafts[id];
  if(!S.member.trim()) return toast('Enter the team member name first.');
  if(r.payout && dr.personal){ r.resolved = {confirmed:true, personal:true, loc:dr.loc, vendor:dr.vendor||r.platform, gl:'Steven personal book', cls:'', by:S.member.trim(), isNewVendor:false}; S.signed = null; render(); return toast('Confirmed. This payout belongs to Steven\'s personal book and is on the Steven personal list, not the Empire import.'); }
  if(!dr.vendor.trim() || !dr.gl.trim() || !dr.cls.trim()) return toast('Vendor, GL account and class are all required.');
  if(Engine.isOwnerClass(dr.cls) && !r.steven) return toast('"Owner Distribution" is not used for Empire transactions. Steven personal charges are handled by the Vendor Master rule.');
  if(Engine.isRetiredClass(dr.cls)) return toast('That class is not used. Use Empire Tours:Chicago instead.');
  if(Engine.isReserved(dr.cls)) return toast(`"${dr.cls}" is reserved for Steven Garcia's personal book. Choose an Empire class.`);
  const vend = dr.vendor.trim();
  if(!r.payout && !r.steven && !S.mHeader.length && !S.master.some(m => Engine.norm(m.vendor)===Engine.norm(vend))) return toast('Load the Vendor Master first, so a new vendor can be added to it.');
  const isNew = !r.payout && !r.steven && !S.master.some(m => Engine.norm(m.vendor)===Engine.norm(vend));
  r.resolved = {confirmed:true, vendor:vend, gl:dr.gl.trim(), cls:dr.cls.trim(), by:S.member.trim(), isNewVendor:isNew, loc:r.payout?dr.loc:''};
  let extra = 0;
  if(isNew){
    const ix = Engine.masterIndex([S.mHeader]); const raw = new Array(S.mHeader.length).fill('');
    const set = (k, v) => { if(ix[k] >= 0) raw[ix[k]] = v; };
    set('vendor', vend); set('file', 'Empire'); set('tier', 'B. Auto-match ready (GL + class fixed)'); set('gl', dr.gl.trim()); set('cls', dr.cls.trim());
    set('autoMatch', 'Yes - limited history (<3 txns)'); set('howTo', 'Apply this GL and class directly. Safe for bank rule / auto-match.'); set('topGl', '100%'); set('topCls', '100%');
    set('usualAcct', r.account.name); set('lastDate', r.dateRaw); set('txns', 1); set('spend', Math.abs(r.amount));
    set('bills', 'No'); set('notes', `NEW vendor proposed by ${S.member.trim()} on ${today()}. Awaiting Jonathan's confirmation.`);
    S.mAdded.push({_id:rid(), vendor:vend, raw, by:S.member.trim(), at:today()});
    S.cfg.newVendorLog.push({_id:rid(), vendor:vend, gl:dr.gl.trim(), cls:dr.cls.trim(), date:today(), by:S.member.trim(), status:'proposed'});
    rebuildMaster(); saveAll();
    const before = S.results.filter(x => x.lane==='old' && x.id!==id).length;
    rerun();
    extra = S.results.filter(x => x.lane==='old' && x.id!==id).length - before;
  }
  S.signed = null; render();
  toast(isNew ? `Confirmed. ${vend} was added to the Vendor Master and the New Vendor Log.${extra>0?` ${extra} other row(s) now match automatically.`:''}` : 'Confirmed');
}

  const d = t.dataset;
  if(d.view) return go(d.view);
  if(d.gotoData){ S.dataTab = d.gotoData==='master' ? 'master' : d.gotoData==='bills' ? 'openBills' : 'master'; return go('data'); }
  if(d.filter){ S.filter = S.filter===d.filter && d.filter!=='all' ? 'all' : d.filter; return render(); }
  if(d.open){ S.open[d.open] = !S.open[d.open]; return render(); }
  if(d.saveList) return doExport(d.saveList);

  if(d.del!==undefined){ S.cfg[S.dataTab].splice(+d.del, 1); saveAll(); rerun(); return render(); }
  if(d.clear){ if(d.clear==='coa'){ S.coa = []; S.coaSource = ''; rerun(); } else { S.classesUp = []; S.classSource = ''; } saveAll(); return render(); }
  if(d.nobills){ S.cfg.noOpenBills = !S.cfg.noOpenBills; if(S.cfg.noOpenBills){ S.cfg.openBills = []; } saveAll(); rerun(); return render(); }
  if(d.undo){ const r = S.results.find(x => x.id===d.undo); r.resolved = null; S.signed = null; return render(); }
  if(d.pickOpt){ const r = S.results.find(x=>x.id===d.pickOpt), x = r.payoutOptions[+d.i], dr = S.drafts[r.id]; dr.personal = !!x.personal; dr.cls = x.personal ? '' : x.cls; dr.loc = x.locs.join(', '); return render(); }

    const r = S.results.find(x => x.id===d.pickVendor), s = r.suggest[+d.i], dr = S.drafts[r.id], card = t.closest('.rc');
    dr.vendor = s.vendor; card.querySelector('[data-k=vendor]').value = s.vendor;
    if(s.gl && s.gl!=='UNCLEAR' && !/\(per invoice\)|\(liability\)/i.test(s.gl)){ dr.gl = s.gl; const sel = card.querySelector('[data-k=gl]'); if(![...sel.options].some(o => o.value===s.gl)){ const o = document.createElement('option'); o.value = s.gl; o.textContent = s.gl; sel.appendChild(o); } sel.value = s.gl; }
    if(s.cls && !/^run class|^n\/a|^bifurcate/i.test(s.cls)){ dr.cls = Engine.remapClass(s.cls); const sel = card.querySelector('[data-k=cls]'); if(![...sel.options].some(o => o.value===s.cls)){ const o = document.createElement('option'); o.value = s.cls; o.textContent = s.cls; sel.appendChild(o); } sel.value = s.cls; }
    return toast('Filled from the existing vendor. Check it before you confirm.');
  }
  if(d.pickGl){ const dr = S.drafts[d.pickGl], card = t.closest('.rc'), sel = card.querySelector('[data-k=gl]'); dr.gl = d.g; if(![...sel.options].some(o => o.value===d.g)){ const o = document.createElement('option'); o.value = d.g; o.textContent = d.g; sel.appendChild(o); } sel.value = d.g; return; }
  if(t.id==='dataBtn') return go('data');
  if(t.id==='processBtn'){ process(); if(!S.txs.length) return toast('No transactions found. Check the column headers (Date, DESCRIPTION, Payee, SPENT, RECEIVED).'); S.filter = 'all'; go('results'); return toast(`Loaded ${S.txs.length} transactions from ${S.feeds.length} file${S.feeds.length===1?'':'s'}`); }
  if(t.id==='signBtn'){ S.signed = {by:S.reviewer.trim(), at:new Date().toLocaleString()}; return render(); }

  if(d.d && t.tagName==='SELECT'){ S.drafts[d.d][d.k] = t.value; if(d.k==='cls') S.drafts[d.d].personal = false; return; }
  if(d.ack!==undefined){ S.acks[d.ack] = t.checked; S.signed = null; return render(); }
  if(d.feedAcct){ const f = S.feeds.find(x => String(x.id)===d.feedAcct); f.acctIdx = +t.value; if(f.acctIdx >= 0) f.count = Engine.loadFeed(f.text, acctFor(f), 'x').length; return render(); }
  if(d.acls!==undefined){ S.cfg.classOverrides[d.acls] = t.value; saveAll(); if(S.feeds.length) rerun(); toast('Saved'); return; }
  if(d.cm){ S.cfg.classMap[d.cm] = t.value; saveAll(); if(S.feeds.length) rerun(); toast('Saved'); return; }
