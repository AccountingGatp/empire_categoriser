<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"></head><body><title>Empire Categoriser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky top bar with sequential step tabs, one focused workspace below. Data-dense but calm. */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#14212A; --muted:#5B6B75; --line:#DDE4E7;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFC;
  --c-bill:#0E7490; --c-old:#1B7F4B; --c-new:#B86E00; --c-exc:#B42318; --c-scope:#66737C;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,33,42,.06),0 4px 16px rgba(20,33,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151A; --surface:#161F26; --surface-2:#1B262E; --ink:#E5ECEF; --muted:#94A4AE; --line:#263540;
  --accent:#7FA2FF; --accent-ink:#0B1220; --accent-soft:#1B2A4A;
  --c-bill:#4FC3DC; --c-old:#4CC38A; --c-new:#F0A83A; --c-exc:#FF7A6E; --c-scope:#93A3AD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#161F26; --surface-2:#1B262E; --ink:#E5ECEF; --muted:#94A4AE; --line:#263540;
  --accent:#7FA2FF; --accent-ink:#0B1220; --accent-soft:#1B2A4A;
  --c-bill:#4FC3DC; --c-old:#4CC38A; --c-new:#F0A83A; --c-exc:#FF7A6E; --c-scope:#93A3AD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--font-display);font-size:18px;font-weight:700}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:2px;overflow-x:auto;flex:1 1 440px;min-width:0;padding:2px}
.step{appearance:none;background:none;border:0;border-radius:8px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap;font-weight:500}
.step .n{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;display:grid;place-items:center;font-family:var(--font-mono)}
.step:hover{background:var(--surface-2);color:var(--ink)}
.step[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.step.done .n{background:var(--c-old);border-color:var(--c-old);color:#fff}
.step .badge{background:var(--c-new);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--font-mono)}
.rulesbtn{margin-left:0}
.keyov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.keybox{max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}.keybox input{width:100%}
.pill{margin-left:auto;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap;color:var(--muted);background:var(--surface)}
.pill::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.pill.ok{color:var(--ink)}.pill.ok::before{background:#1f9d55}.pill.warn::before{background:#d98a00}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:24px}
.pagehead p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.pop{box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:var(--c-new);background:color-mix(in srgb,var(--c-new) 10%,var(--surface))}

/* upload */
.upgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--font-display);font-size:18px}
.feed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.feed:last-child{border-bottom:0}
.ready{display:flex;flex-direction:column;gap:2px}
.rd{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rd:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c-scope)}
.dot.ok{background:var(--c-old)}.dot.warn{background:var(--c-new)}.dot.bad{background:var(--c-exc)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--c)}
.tile:hover{box-shadow:var(--shadow)}
.tile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:var(--c)}
.tile .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1}
.tile .lbl{font-weight:600;font-size:13px}
.tile .sub{font-size:12px;color:var(--muted)}
.tag[class*="l-"]{color:var(--c);border-color:var(--c)}
.l-bill{--c:var(--c-bill)}.l-old{--c:var(--c-old)}.l-new{--c:var(--c-new)}.l-exception{--c:var(--c-exc)}.l-scope{--c:var(--c-scope)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.mini{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.mini.newv{color:var(--accent-ink);background:var(--accent)}
.mini.adm{color:var(--c-new);background:color-mix(in srgb,var(--c-new) 14%,transparent)}
.mini.lim{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.lists{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lists button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.lists button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lists .ct{font-family:var(--font-mono);font-size:12px;opacity:.85}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:800px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.newrow td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.sub{color:var(--muted);font-size:12px}
.in{color:var(--c-old)}
.why td{background:var(--surface-2);font-size:13px}
.why ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ellip{overflow-wrap:anywhere}

/* resolve */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px}
.rc{display:flex;flex-direction:column;gap:12px}
.rc.done{opacity:.75;border-color:var(--c-old)}
.rc.isnew{border-color:var(--accent)}
.rc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc-head .amt{font-size:18px;font-weight:500}
.rc .whybox{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--muted);font-weight:400}
.picks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picks .lbl{font-size:11px;color:var(--muted)}
.pick{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.glrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px}
progress{width:200px;height:8px;accent-color:var(--c-old)}

/* review / export */
.flag{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.flag .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sev-warn{color:var(--c-new)}.sev-crit{color:var(--c-exc)}
.signoff{display:grid;grid-template-columns:minmax(0,260px) auto 1fr;gap:14px;align-items:end}
.stat{display:flex;gap:24px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:22px}
.exports{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.exp{display:flex;flex-direction:column;gap:8px}
.exp p{margin:0;color:var(--muted);font-size:13px;flex:1}
.exp h3{font-size:15px}
.lock{text-align:center;padding:36px 16px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}

/* data page */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.dcard{display:flex;flex-direction:column;gap:10px}
.dcard h3{font-size:16px}
.dcard p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
td input[type=text],td input[type=number],td input[type=date],td select{min-width:110px}
td input[type=checkbox]{width:18px;height:18px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:30;max-width:calc(100vw - 32px)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.upgrid{grid-template-columns:1fr}.signoff{grid-template-columns:1fr}}
@media (max-width:760px){.steps{order:3;flex:1 0 100%}.rulesbtn{margin-left:auto}.feed{grid-template-columns:1fr}}
@media (max-width:520px){.two,.glrow{grid-template-columns:1fr}.pagehead h2{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:box-shadow .15s,border-color .15s}}
</style>

<header class="topbar"><div class="topin">
  <div class="brand"><b>Empire Categoriser</b><span>Bank feed to SaasAnt</span></div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <span class="pill off" id="cloudPill">This browser only</span>
  <button class="btn rulesbtn" id="auditBtn">Check old file</button>
  <button class="btn rulesbtn" id="dataBtn">Data &amp; rules</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* Empire categorisation engine v3. Pure functions, no DOM. Mirrors SOP sections 1, 4, 4.1, 5, 6, 8, 9, 13 and the Vendor Master tiers. */
const Engine = (() => {
  const RESERVED = ['wi', 'nola', 'ohio', 'pownwall', 'pownall', 'pownall llc oh', 'personal', 'not specified', 'unclassified'];
  const PERSONAL_KEYWORDS = ['cassville', 'cassiwille', 'wisconsin', 'ohio', 'nola', 'pownwall'];
  const SCOPE_KEYWORDS = ['payroll', 'transfer'];   // SOP v1.9 (2026-10-01): Xola/Viator payouts and distributions are IN scope again
  /* SOP 13.6 confirmed Xola / Viator location -> class table (Dhwani 2026-10-01). personal = Steven's personal book, never Empire. */
  const DEFAULT_PAYOUT_LOCATIONS = [
    { name: 'Chicago_Discount_Tours', cls: 'Empire Tours:Chicago' }, { name: 'Chicago_Gangsters_and_Ghosts_Tours', cls: 'Empire Tours:Chicago' },
    { name: 'Chicago_Private_Tours', cls: 'Empire Tours:Chicago' }, { name: 'Chicago_Private_Boat_Tours', cls: 'Empire Tours:Chicago:Chicago Boats' },
    { name: 'Chicago_River_Boat_Architecture_Tours', cls: 'Empire Tours:Chicago:Chicago Boats' }, { name: 'NYC_Discount_Tours', cls: 'NYC' },
    { name: 'NYC_Gangsters_and_Ghosts_Tours', cls: 'NYC:NYC G&G' }, { name: 'Tours_of_NYC', cls: 'NYC' }, { name: 'ToursOfNYC', cls: 'NYC' },
    { name: 'Amsterdam_Tours', cls: 'Empire Tours:Amsterdam' }, { name: 'Austin_Tours', cls: 'Empire Tours:Austin' }, { name: 'Charleston_Tour_Company', cls: 'Empire Tours:Charleston' },
    { name: 'Italy_Tours', cls: 'Empire Tours:Milan' }, { name: 'Milan_Tours', cls: 'Empire Tours:Milan' }, { name: 'London_Sightseeing_Tours', cls: 'Empire Tours:London' }, { name: 'Washington_DC_Sightseeing_Tours', cls: 'Empire Tours:Washington DC' }, { name: 'See_It_All_Chicago_Tours_LLC', cls: 'Empire Tours:SIA' },
    { name: 'Ohio_Cabins', cls: '', personal: true }, { name: 'Wisconsin_Lodges', cls: '', personal: true }, { name: 'NOLA', cls: '', personal: true }, { name: 'Pownwall', cls: '', personal: true }
  ];
  const SUFFIX_RE = /(?:\s?[_\-]\s?(?:g|e|gbp|euro|eur|usd|v|cfl)|\s-\s(?:usd|gbp|eur))$/i;
  const TITLE_RE = /^(miss|mr|mrs|ms|dr)\s+/i;
  const CUR_SUFFIXES = { GBP: ['_g', '-g', '_gbp', ' _g'], EUR: ['_e', '_euro', '_eur', '-e'], USD: [''] };
  const DEFAULT_CLASS_MAP = { Chicago: 'Empire Tours:Chicago', NYC: 'NYC', SIA: 'Empire Tours:SIA', GBP: 'Empire Tours:London', Administrative: 'Empire Tours:Administrative' };
  const DEFAULT_US_PAYROLL = ['Empire Tours:Chicago', 'NYC', 'Empire Tours:SIA', 'Empire Tours:Washington DC', 'Empire Tours:Administrative'];
  const DEFAULT_BILL_ONLY = ['yassine achebarrou', 'chicago from the lake', 'shoreline', 'google llc', 'google ads', 'google marketing'];

  /* ---------- text helpers ---------- */
  const norm = s => String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const baseKey = s => norm(String(s || '').replace(SUFFIX_RE, '').replace(TITLE_RE, ''));
  const hasWord = (text, w) => new RegExp('(^|[^a-z])' + w + 's?([^a-z]|$)', 'i').test(text);
  const wordHit = (text, word) => new RegExp('(^|[^a-z])' + word + '([^a-z]|$)', 'i').test(text);
  const money = s => { if (s == null) return 0; const n = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
  const glNumber = gl => { const m = String(gl || '').match(/^\s*(\d+)\b/); return m ? parseInt(m[1], 10) : null; };
  const stripNum = gl => String(gl || '').replace(/^\s*\d+\s+/, '').trim();
  function isReserved(c) {
    const x = norm(c).replace(/^do not use\s*/, '');
    if (!x) return false;
    const parts = x.split(':');
    return RESERVED.includes(x) || RESERVED.includes(parts[parts.length - 1].trim());
  }

  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = String(text).replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }
  function csvToObjects(text) {
    const rows = parseCSV(text); if (!rows.length) return [];
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  }
  function toCSV(rows) {
    const esc = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return rows.map(r => r.map(esc).join(',')).join('\r\n') + '\r\n';
  }
  function isoDate(s) {
    const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : s;
  }

  /* ---------- bank feed ---------- */
  function extractVendor(desc, payee) {
    if (payee && payee.trim()) return payee.replace(/\s+/g, ' ').trim();
    let d = String(desc || '');
    d = d.replace(/^(sent money to|sent money|received money from|received money|paid to|card transaction of [\d.]+ [a-z]+ (issued )?by)\s*/i, '');
    d = d.replace(/\s*ref:.*$/i, '').replace(/^(miss|mr|mrs|ms)\s+/i, '');
    return d.replace(/\s+/g, ' ').trim();
  }

  function loadFeed(csvText, account, prefix, forced) {
    const recs = csvToObjects(csvText);
    const pick = (r, ...names) => { for (const n of names) { const k = Object.keys(r).find(h => h.toLowerCase() === n); if (k && r[k] !== '') return r[k]; } return ''; };
    prefix = prefix || 'f0';
    return recs.map((r, i) => {
      let spent = money(pick(r, 'spent', 'payment', 'debit', 'withdrawal')), rec = money(pick(r, 'received', 'deposit', 'credit'));
      const amt = pick(r, 'amount');
      if (!spent && !rec && amt) { const a = money(amt); if (a < 0) spent = -a; else rec = a; }
      const desc = pick(r, 'description', 'memo', 'name');
      const payee = pick(r, 'payee', 'vendor');
      const dateRaw = pick(r, 'date');
      const id = prefix + '-t' + i;
      return {
        id, dateRaw, date: isoDate(dateRaw), desc, payee, vendor: extractVendor(desc, payee),
        amount: Math.round((rec - spent) * 100) / 100,
        suggestedGL: pick(r, 'categorize or match', 'category'),
        suggestedClass: pick(r, 'class'),
        force: !!(forced && forced.has(id)),
        account
      };
    }).filter(t => t.desc || t.payee || t.amount);
  }

  /* ---------- Vendor Master ---------- */
  const MASTER_COLS = [
    ['vendor', 'vendor name'], ['file', 'quickbooks file'], ['tier', 'vendor tier'], ['gl', 'gl account'], ['cls', 'class'],
    ['autoMatch', 'auto-match'], ['howTo', 'how to'], ['topGl', 'top gl'], ['otherGls', 'other gls'], ['topCls', 'top class'],
    ['otherCls', 'other classes'], ['usualAcct', 'usual paying'], ['lastDate', 'last txn'], ['recentGl', 'most recent'],
    ['txns', '# txns'], ['spend', 'total spend'], ['bills', 'bills in last'], ['notes', 'notes']
  ];
  function masterHeader(aoa) {
    const H = aoa[0].map(h => String(h || '').trim().toLowerCase());
    const ix = {};
    MASTER_COLS.forEach(([k, needle]) => { ix[k] = k === 'cls' ? H.findIndex(h => h === 'class') : H.findIndex(h => h.startsWith(needle)); });
    return ix;
  }
  function parseMaster(aoa) {
    if (!aoa || !aoa.length) throw new Error('The Vendor Master sheet is empty.');
    const ix = masterHeader(aoa);
    if (ix.vendor < 0 || ix.tier < 0) throw new Error('This does not look like the Vendor Master (it needs "Vendor Name" and "Vendor Tier" columns).');
    const get = (r, k) => (ix[k] >= 0 && r[ix[k]] != null ? String(r[ix[k]]).trim() : '');
    return aoa.slice(1).filter(r => get(r, 'vendor')).map(r => {
      const tierName = get(r, 'tier');
      const notes = get(r, 'notes'), txns = parseFloat(get(r, 'txns')) || 0;
      return {
        vendor: get(r, 'vendor'), tier: (tierName.match(/^[A-Z]\d?/) || ['?'])[0], tierName,
        gl: get(r, 'gl'), cls: get(r, 'cls'), autoMatch: get(r, 'autoMatch'), howTo: get(r, 'howTo'),
        topGl: parseFloat(get(r, 'topGl')) || 0, otherGls: get(r, 'otherGls'), topCls: parseFloat(get(r, 'topCls')) || 0, otherCls: get(r, 'otherCls'),
        usualAcct: get(r, 'usualAcct'), lastDate: get(r, 'lastDate'), txns, billsRecent: /^yes/i.test(get(r, 'bills')),
        notes, dd: /num=dd/i.test(notes), limited: /limited history/i.test(get(r, 'autoMatch')) || (txns > 0 && txns < 3),
        src: 'file', raw: r.map(x => x == null ? '' : x)
      };
    });
  }
  // Interim dropdown lists taken from the Vendor Master itself, until the real Chart of Accounts / Classes are uploaded
  function deriveLists(master) {
    const gls = new Set(), classes = new Set();
    const okClass = c => c && /^(empire tours|nyc|economic development)/i.test(c) && !isReserved(c);
    const splitOther = s => (String(s || '').match(/([^;()]+?) \(\d+%\)/g) || []).map(x => x.replace(/ \(\d+%\)$/, '').trim());
    master.forEach(m => {
      if (['B', 'C1', 'C2', 'C3'].includes(m.tier)) {
        if (m.gl && m.gl !== 'UNCLEAR') gls.add(m.gl);
        splitOther(m.otherGls).forEach(g => gls.add(g));
      }
      if (okClass(m.cls)) classes.add(m.cls);
      splitOther(m.otherCls).forEach(c => { if (okClass(c)) classes.add(c); });
    });
    return { gls: [...gls].sort((a, b) => a.localeCompare(b)), classes: [...classes].sort((a, b) => a.localeCompare(b)) };
  }

  function buildIndex(master) {
    const byFull = new Map(), byBase = new Map();
    master.forEach(m => {
      byFull.set(norm(m.vendor), m);
      const b = baseKey(m.vendor); if (!byBase.has(b)) byBase.set(b, []); byBase.get(b).push(m);
    });
    return { byFull, byBase };
  }

  // Exact QBO name when the feed already carries a suffix; otherwise the multicurrency suffix that belongs to the bank
  // account's currency (Wise GBP -> _G, Wise EUR -> _E) before the bare name.
  function resolveVendor(name, cur, ix) {
    const n = norm(name); if (!n) return { rec: null, similar: [] };
    const explicit = SUFFIX_RE.test(String(name).trim());
    const exact = ix.byFull.get(n);
    if (explicit && exact) return { rec: exact, how: 'exact' };
    const base = baseKey(name);
    const sufs = (CUR_SUFFIXES[cur] || ['']).filter(s => s !== '');
    for (const s of sufs) for (const t of ['', 'miss ', 'mr ', 'mrs ', 'ms ']) {
      const hit = ix.byFull.get(norm(t + base + s));
      if (hit) return { rec: hit, how: 'currency suffix' };
    }
    if (exact) return { rec: exact, how: 'exact' };
    for (const t of ['miss ', 'mr ', 'mrs ', 'ms ']) { const hit = !sufs.length && ix.byFull.get(norm(t + base)); if (hit) return { rec: hit, how: 'title prefix' }; }
    return { rec: null, similar: ix.byBase.get(base) || [] };
  }

  // Existing QBO vendors whose name appears in the description, to help the person pick instead of creating a duplicate
  function suggestVendors(text, master) {
    const t = norm(text), out = [];
    for (const m of master) {
      const b = baseKey(m.vendor);
      if (b.length >= 4 && (t.includes(b) || (t.length >= 5 && b.includes(t)))) out.push(m);
      if (out.length >= 6) break;
    }
    return out;
  }

  /* ---------- chart of accounts ---------- */
  function coaResolve(coa, name) {
    if (!coa || !coa.length) return { name, verified: false };
    const n = norm(name), bare = norm(stripNum(name));
    let hits = coa.filter(e => norm(e.full) === n);
    if (!hits.length) hits = coa.filter(e => { const last = norm(e.name.split(':').pop()); return norm(e.name) === bare || last === bare || norm(stripNum(e.full)) === bare; });
    if (hits.length === 1) return { name: hits[0].full, verified: true, entry: hits[0] };
    return { name, verified: true, error: hits.length ? 'ambiguous' : 'missing', options: hits };
  }

  /* ---------- class helpers ---------- */
  const mapClass = (c, cfg) => (cfg && cfg.classMap && cfg.classMap[c]) || DEFAULT_CLASS_MAP[c] || c;
  function classFromKeywords(desc, cfg) {
    if (/chicago/i.test(desc)) return { cls: mapClass('Chicago', cfg), why: 'description contains "Chicago"' };
    if (wordHit(desc, 'nyc') || wordHit(desc, 'ny') || /new york/i.test(desc)) return { cls: mapClass('NYC', cfg), why: 'description contains NYC / NY / New York' };
    if (/see it all/i.test(desc)) return { cls: mapClass('SIA', cfg), why: 'description contains "See It All"' };
    return null;
  }
  /* Retired classes (Jonathan/Dhwani 2026-10-07): Chicago Private, Chicago G&G and Chicago Walking are never used. Those items are plain Chicago. */
  const RETIRED_CLASS = /(^|:)chicago (private|g&g|walking)$/i;
  const isRetiredClass = c => RETIRED_CLASS.test(String(c || '').trim());
  const remapClass = c => isRetiredClass(c) ? 'Empire Tours:Chicago' : c;
  const isUsPayrollClass = (cls, cfg) => (cfg.usPayrollClasses || DEFAULT_US_PAYROLL).some(c => norm(cls) === norm(c) || norm(cls).startsWith(norm(c) + ':'));

  /* SOP 13.2 (confirmed by the team leader 2026-09-30): Steven personal charge on an Empire account ->
     Due to Shareholder - Steven Garcia (liability), class Owner Distribution for every such row.
     Never the Ohio / NOLA / WI classes, those belong to his personal book. Mirror JE goes in his book. */
  const OWNER_CLASS = 'Empire Tours:Owner Distribution';
  function stevenGl(desc, cfg) {
    const hit = (cfg.coa || []).find(e => e.num === '11071');
    return hit ? hit.full : '11071 Due to Shareholder - Steven Garcia';
  }
  function stevenRow(out, tx, cfg, why, trace) {
    out.lane = 'old'; out.steven = true; out.gl = stevenGl(tx.desc, cfg); out.cls = (cfg.ownerClass || OWNER_CLASS); out.source = 'Steven personal rule (SOP 13.2)';
    out.reason = why + ' Posted to Due to Shareholder - Steven Garcia (a liability) with class Owner Distribution. The mirror journal entry goes in Steven\'s personal book (debit the real expense, credit Due to Empire).';
    trace.push('Steven personal rule: GL ' + out.gl + ', class ' + out.cls + '. Listed on the mirror JE list.');
    return out;
  }

  /* Xola payout lookup: the Payouts Report (or the Xola API) gives each location's payout total (the sum of its Net column equals the bank deposit).
     A bank deposit is matched to those totals by amount. The location's class comes from the SOP 13.6 table. */
  const normLoc = x => String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const findLoc = (name, cfg) => (cfg.payoutLocations || DEFAULT_PAYOUT_LOCATIONS).find(l => normLoc(l.name) === normLoc(name)) || null;
  function payoutOptions(tx, cfg) {
    const a = Math.round(tx.amount * 100) / 100, by = new Map();
    (cfg.payoutIndex || []).forEach(e => {
      if (Math.abs(Math.round(Number(e.net) * 100) / 100 - a) > 0.005) return;
      if (e.date && tx.date) { const dd = (Date.parse(tx.date) - Date.parse(e.date)) / 864e5; if (!isNaN(dd) && (dd < -1 || dd > 21)) return; }
      const l = findLoc(e.loc, cfg);
      const key = l ? (l.personal ? 'PERSONAL' : (l.cls || '?' + e.loc)) : '?' + e.loc;
      if (!by.has(key)) by.set(key, { cls: l && !l.personal ? l.cls : '', personal: !!(l && l.personal), known: !!l, locs: [], dates: [] });
      const o = by.get(key); if (!o.locs.includes(e.loc)) o.locs.push(e.loc); if (e.date && !o.dates.includes(e.date)) o.dates.push(e.date);
    });
    return [...by.values()];
  }

  /* ---------- one transaction ---------- */
  function classifyOne(tx, cfg, ix) {
    const trace = [];
    const acct = tx.account || {};
    const out = { lane: 'new', gl: '', cls: '', source: '', tier: '', qboVendor: '', topGl: 0, newVendor: false, adminReview: false, limited: false, reason: '', trace, exKind: '', billStatus: '', sub: '', suggestGls: [], suggest: [], hint: '' };
    const descL = tx.desc.toLowerCase();
    const vkey = baseKey(tx.vendor);
    const bankClass = acct.bankClass ? mapClass(acct.bankClass, cfg) : '';

    /* SOP 1: journal-entry-driven items never enter this pipeline */
    if (!tx.force) {
      const g = glNumber(tx.suggestedGL);
      // "transfer" means an inter-account transfer. A WIRE TRANSFER to a named beneficiary is a payment to a third party, so it is not out of scope.
      const kw = SCOPE_KEYWORDS.find(k => (hasWord(descL, k) || hasWord(vkey, k)) && !(k === 'transfer' && /\bwire\b/.test(descL)));
      const conv = /(convert|conversion|exchange)/i.test(tx.desc);
      const plat = hasWord(descL, 'xola') || hasWord(vkey, 'xola') ? 'xola' : (hasWord(descL, 'viator') || hasWord(vkey, 'viator')) ? 'viator' : '';
      const ex = tx.amount > 0 && (cfg.excluded || []).find(e => baseKey(e.vendor) === vkey && /sales clearing/i.test(e.gl || ''));
      if (conv) {
        const cur = [...new Set((tx.desc.match(/\b(USD|GBP|EUR)\b/g) || []))];
        out.lane = 'scope'; out.sub = 'conversion';
        out.reason = cur.includes('GBP') && cur.includes('EUR') ? 'Currency conversion GBP to EUR. Book the rate difference to Gain/Loss on Foreign Exchange (deposit if a gain, expense if a loss). SOP 13.4.'
          : cur.length ? `Currency conversion ${cur.join(' / ')}. A USD to GBP conversion is a straight Transfer with no GL impact. SOP 13.4.` : 'Currency conversion. Handled as a Transfer, or FX gain/loss for GBP to EUR. SOP 13.4.';
        trace.push('Currency conversion: handled as a Transfer / FX entry, never categorised.');
        return out;
      }
      /* SOP 4 step 3(a), 13.6: a payout from Xola / Viator / another platform goes to its Clearing account, never revenue. The class depends on
         WHICH location report the payout came from, which is not in the bank line, so a Team Member picks the location. */
      if (tx.amount > 0 && (plat || ex || g === 10031 || g === 10032)) {
        const clr = ex ? ex.gl : (plat === 'viator' || g === 10032) ? '10032 Sales Clearing Account:Viator Sales' : '10031 Sales Clearing Account:XOLA Sales';
        const cc = coaResolve(cfg.coa, clr);
        const isXola = !ex && plat !== 'viator' && g !== 10032;
        out.lane = 'new'; out.payout = true; out.platform = ex ? ex.vendor : (plat === 'viator' || g === 10032) ? 'Viator' : 'Xola';
        out.gl = cc.error ? clr : cc.name; out.cls = ''; out.source = 'Platform payout rule (SOP 13.6)';
        const opts = isXola ? payoutOptions(tx, cfg) : [];
        out.payoutOptions = opts;
        const base = `Payout from ${out.platform}. It posts to the Clearing account (${out.gl}), never to revenue.`;
        if (opts.length === 1 && !opts[0].personal && opts[0].cls) {
          out.cls = opts[0].cls;
          out.reason = `${base} The amount matches the Xola payout of ${opts[0].locs.join(', ')}${opts[0].dates.length ? ' (paid ' + opts[0].dates.join(', ') + ')' : ''}, so the class is ${opts[0].cls} (SOP 13.6). Confirm to add it.`;
          trace.push('Platform payout: amount matched one Xola payout, class from the location table.');
        } else if (opts.length === 1 && !opts[0].personal && !opts[0].cls) {
          out.adminDefault = true;
          out.reason = `${base} The amount matches the Xola payout of ${opts[0].locs.join(', ')}, but that location has no class in the SOP table. Administrative is pre-selected (SOP 4.1 Step 5); choose the right class and tell the Reviewer so the table can be completed.`;
          trace.push('Platform payout: matched a location with no class in the table. Administrative by default.');
        } else if (opts.length === 1 && opts[0].personal) {
          out.reason = `${base} The amount matches a payout of ${opts[0].locs.join(', ')}, a personal property of Steven Garcia. It belongs in his personal book, not the Empire import (SOP 13.6).`;
          trace.push('Platform payout: matched a personal location (Steven).');
        } else if (opts.length > 1) {
          out.pickClass = true;
          out.reason = `${base} More than one Xola location had a payout of exactly this amount (${opts.map(o => o.locs.join(', ')).join(' / ')}). Choose which one this deposit is.`;
          trace.push('Platform payout: same amount in several locations. A person chooses the class.');
        } else {
          out.adminDefault = true;
          out.reason = `${base} ${isXola ? ((cfg.payoutIndex || []).length ? 'No Xola payout of this amount was found' : 'No Xola payouts are loaded') : 'The class cannot be read from the bank line'}, so Administrative is pre-selected (SOP 4.1 Step 5) and the row goes on the Administrative Class Review List. Change it if you know the location.`;
          trace.push('Platform payout: no location match. Administrative by default.');
        }
        return out;
      }
      if (plat && tx.amount < 0) {
        out.lane = 'new'; out.platform = plat === 'viator' ? 'Viator' : 'Xola';
        out.reason = `Money going out to ${out.platform}. A top-up or refund-reserve transfer is entered as a Transfer between accounts (SOP 13.4), anything else is a normal expense. A person decides.`;
        trace.push('Outgoing platform payment. Held for a person.');
        return out;
      }
      if (kw) {
        out.lane = 'scope';
        if (kw === 'transfer') { out.sub = 'transfer'; out.reason = 'Transfer between two of your own accounts. It is entered as a Transfer, never as income or an expense (SOP 4 step 3c, 13.4). Not part of the Expense / Deposit import.'; }
        else out.reason = 'Payroll. It stays a Journal Entry process outside this bank-feed pipeline (SOP 13.3).';
        trace.push(kw === 'transfer' ? 'Inter-account transfer: listed for a Transfer entry.' : 'Payroll: Journal Entry process, outside this pipeline.');
        return out;
      }
    }

    /* Resolve the QBO vendor record early: bill-only rules and tier A need it */
    const found = resolveVendor(tx.vendor, acct.cur, ix);
    const rec = found.rec;
    if (rec) { out.qboVendor = rec.vendor; out.tier = rec.tier; out.limited = rec.limited; out.topGl = rec.topGl; }
    out.newVendor = !rec && !!tx.vendor;
    if (!rec && tx.vendor) out.suggest = suggestVendors(tx.desc + ' ' + tx.vendor, cfg.master || []).map(m => ({ vendor: m.vendor, tier: m.tier, gl: m.gl, cls: m.cls }));

    /* SOP step 2: open bill check, before any categorisation */
    if (tx.amount < 0 && tx.vendor && !(rec && rec.dd)) {   // Num = DD expenses are system generated, never a Bill Payment (SOP step 2)
      const bills = (cfg.openBills || []).filter(b => baseKey(b.vendor) === vkey);
      const hit = bills.find(b => b.amount > 0 && Math.abs(b.amount - Math.abs(tx.amount)) < 0.005);
      const nBills = bills.filter(b => !b.total && b.amount > 0).length;
      const isA2 = !!(rec && rec.tier === 'A2');   // Yassine hybrid: the Vendor Master amount map decides, not the bill-only name list
      const patt = !isA2 && (cfg.billOnlyPatterns || DEFAULT_BILL_ONLY).some(p => vkey.includes(norm(p)));
      if (hit) {
        out.lane = 'bill'; out.billStatus = 'match';
        out.reason = `Matches ${hit.total ? 'the total open balance' : 'an open bill'} of ${hit.amount.toFixed(2)}${hit.bucket ? ' (A/P aging: ' + hit.bucket + ')' : hit.date ? ' dated ' + hit.date : ''}${hit.no ? ' (bill ' + hit.no + ')' : ''}. Confirm with Pay Bills / Match in QBO.`;
        trace.push('Step 2: open bill found for this vendor and amount. Routed to the Bill Payments List, not categorised.');
        return out;
      }
      if (nBills && !isA2) {
        out.lane = 'bill'; out.billStatus = 'amount';
        out.reason = `Vendor has open bills (${nBills} on the A/P report), none for this amount. A person checks for a part-payment before matching.`;
        trace.push('Step 2: vendor has open bills but the amount differs. Routed to the Bill Payments List.');
        return out;
      }
      if (patt || (rec && rec.tier === 'A')) {
        out.lane = 'bill'; out.billStatus = 'nobill';
        out.reason = 'Bill-payment-only vendor (SOP 13.1) with no open bill on file. Enter the bill first, then Pay Bills / Match.' + (rec && rec.howTo ? ' ' + rec.howTo : '');
        trace.push('Step 2: bill-payment-only vendor. Never categorised as a standalone expense.');
        return out;
      }
      trace.push('Step 2: no open bill for this vendor. Continue to categorisation.');
    }

    if (!tx.vendor) {
      out.lane = 'exception'; out.exKind = 'novendor';
      out.reason = 'No vendor could be identified. Held in the Exception Queue, never posted under a placeholder.';
      trace.push('No vendor identifiable (SOP 6.1).');
      return out;
    }

    const emails = (cfg.emailRules || []).filter(e => baseKey(e.vendor) === vkey).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const email = emails[0];

    /* SOP 4.1 Step 1b: personal-book keywords */
    const pk = PERSONAL_KEYWORDS.find(k => hasWord(descL, k));
    if (pk && !(email && email.cls)) {
      if (cfg.stevenPost === false) {
        out.lane = 'exception'; out.exKind = 'personal';
        out.reason = `Description contains "${pk}". This may belong to Steven Garcia's personal book. Posting of Steven personal rows is switched off in Data & rules, so it is held.`;
        trace.push('Step 1b: personal-book keyword. Routed to the Exception Queue (posting switched off).');
        return out;
      }
      out.exKind = ''; trace.push(`Step 1b: description contains "${pk}".`);
      return stevenRow(out, tx, cfg, `Description contains "${pk}", a personal-book keyword (SOP 4.1 Step 1b). The Reviewer confirms it really is Steven's.`, trace);
    }

    /* Vendor Master tiers that are never auto-coded */
    if (rec) {
      trace.push(`Vendor Master: QBO vendor "${rec.vendor}" (${found.how === 'exact' ? 'exact name' : 'matched by ' + found.how + ' for this account'}), tier ${rec.tier}.`);
      if (rec.tier === 'E') {
        if (cfg.stevenPost === false) { out.lane = 'exception'; out.exKind = 'steven'; out.reason = "Steven Garcia personal charge on an Empire account. Posting is switched off in Data & rules, so it is held. Code to Due to Shareholder - Steven Garcia with class Owner Distribution and make the mirror journal entry in Steven's personal book (SOP 13.2)."; return out; }
        stevenRow(out, tx, cfg, 'Steven Garcia personal charge on an Empire account (Vendor Master tier E, SOP 13.2). Tier E goes to New Transactions for a human decision, never auto-imported (SOP step 5); the account and class are pre-filled.', trace);
        out.lane = 'new'; return out;
      }
      if (rec.tier === 'F') { out.lane = 'new'; out.reason = 'This vendor\'s history uses a class reserved for Steven personal book, or Unclassified (tier F). A person decides: choose a real Empire class, or route to his personal book (SOP step 5, 13.2).'; trace.push('Tier F: New Transactions.'); return out; }
      /* Tier A2, Yassine hybrid (Vendor Master sheet "Yassine Amount Map", Dhwani 2026-10-01). An open Bill of the same amount was already
         routed to the Bill Payments List above. Otherwise the payment amount decides. Only the Wise GBP record (_G) follows the map. */
      if (rec.tier === 'A2' && tx.amount < 0) {
        const a = Math.round(Math.abs(tx.amount) * 100) / 100;
        const hold = (kind, why) => { out.lane = 'exception'; out.exKind = kind; out.reason = why; trace.push('Yassine amount map: ' + why); return out; };
        if (!/_G$/i.test(rec.vendor)) return hold('amountmap', 'Yassine on the USD (Chase) record. Wires to Yassine without the Wise GBP record go to the Exception Queue: ask Jonathan (Yassine amount map #9).');
        if (!cfg.openBillsChecked) { out.reason = 'Yassine payments depend on whether an open Expensify Bill exists (amount map #1). Load the open bills, or confirm there are none.'; trace.push('Yassine amount map: open-bills data missing. Held.'); return out; }
        const post = (glName, n, note) => {
          const c = coaResolve(cfg.coa, glName);
          if (c.error) { out.reason = `GL "${glName}" from the Yassine amount map (#${n}) is ${c.error === 'ambiguous' ? 'ambiguous' : 'not'} in the chart of accounts. Pick the right account.`; trace.push('Yassine amount map: GL not usable. Held.'); return out; }
          out.gl = c.name; out.glVerified = c.verified; out.cls = rec.cls; out.source = 'Yassine amount map #' + n; out.lane = 'old';
          if (isReserved(out.cls)) { out.lane = 'exception'; out.exKind = 'reserved'; out.reason = `Class "${out.cls}" is not allowed in Empire.`; return out; }
          trace.push(`Yassine amount map #${n}: ${a.toFixed(2)} with no open Bill is an Expense, ${glName}, ${rec.cls}.${note ? ' ' + note : ''}`);
          return out;
        };
        if (a === 1850 || a === 1750) return post('Building & land rent', 6);
        if (a === 32.5 || a === 34.5) { out.lane = 'bill'; out.billStatus = 'nobill'; out.reason = 'Monthly phone amount (32.50 / 34.50) is a Bill (Phone service, London). Enter the Bill, then Pay Bills / Match (Yassine amount map #7).'; trace.push('Yassine amount map #7: phone bill.'); return out; }
        if (a === 7) return hold('amountmap', 'A 7.00 payment with no memo. Exception if there is no description (Yassine amount map #4).');
        if (a < 500) return post('Contract labor', 2,'');
        if (a >= 1650 && a <= 5700) return post('City Manager Salary', 5);
        return hold('amountmap', `Amount ${a.toFixed(2)} is outside the Yassine amount map (under 500, 1,650 to 5,700, or the fixed amounts). A person decides.`);
      }
      if (rec.tier === 'D') { out.lane = 'new'; out.reason = 'Payroll / City Manager split is pending in QuickBooks (tier D). Never auto-coded and no bank rule; a person decides (SOP step 5, 13.3).'; trace.push('Tier D: New Transactions.'); return out; }
    }

    /* SOP step 3: bank rules (exact vendor plus description) */
    const cands = [];
    const rules = (cfg.bankRules || []).filter(r => r.contains && descL.includes(r.contains.toLowerCase()));
    const exactRule = rules.find(r => r.vendor && baseKey(r.vendor) === vkey);
    if (exactRule) { cands.push({ src: 'Bank rule', gl: exactRule.gl, cls: exactRule.cls }); trace.push(`Step 3: bank rule "${exactRule.contains}" fired on vendor and description.`); }
    const misfire = !exactRule && rules[0];
    if (misfire) {
      out.reason = `Bank rule "${misfire.contains}" matched the description only, not the vendor. Possible keyword misfire, held for a person.`;
      trace.push('Fuzzy bank-rule match. Held (SOP section 5).');
      return out;
    }

    /* SOP step 4: Vendor Master */
    if (rec) {
      if (rec.tier === 'C2') {
        out.reason = 'Vendor uses several GL accounts. Choose from the receipt or expense report. If unsure, ask (SOP 13.6).';
        out.suggestGls = [rec.gl, ...String(rec.otherGls).split(';').map(x => x.replace(/ \(\d+%\)$/, '').trim())].filter(Boolean);
        out.cls = rec.cls && !/^run class/i.test(rec.cls) ? remapClass(rec.cls) : '';
        trace.push('Tier C2: multiple GLs. Held for a person.');
        return out;
      }
      if (rec.tier === 'C3') {
        out.reason = 'The Vendor Master has no GL for this vendor (split bills). Open the original Bill in QBO to see the real category, or check whether this is a bill payment.';
        out.cls = rec.cls && !/^run class/i.test(rec.cls) ? remapClass(rec.cls) : '';
        trace.push('Tier C3: GL not captured. Held for a person.');
        return out;
      }
      // the open-bill check needs data: without it a Bill Payment cannot be ruled out
      if (rec.billsRecent && !rec.dd && tx.amount < 0 && !cfg.openBillsChecked) {
        out.reason = 'This vendor had bills in the last 90 days and no open-bills list is loaded, so a Bill Payment cannot be ruled out. Load the open bills, or confirm there are none.';
        trace.push('Step 2 cannot be completed: no open-bills data. Held.');
        return out;
      }
      const clsGiven = rec.tier === 'B' && rec.cls && !/^run class|^n\/a|^bifurcate/i.test(rec.cls) ? rec.cls : '';
      cands.push({ src: 'Vendor Master', gl: rec.gl, cls: clsGiven });
    } else if (found.similar && found.similar.length) {
      out.hint = 'Similar QBO vendor on another currency: ' + found.similar.map(s => `${s.vendor} (tier ${s.tier})`).join(', ') + '.';
    }

    /* SOP step 5: Jonathan email log */
    if (email && email.gl) { cands.push({ src: 'Email rule', gl: email.gl, cls: email.cls }); trace.push(`Step 5: Jonathan email rule${email.date ? ' dated ' + email.date : ''}.`); }

    if (!cands.length) {
      out.reason = rec ? 'Vendor is in the Vendor Master but gives no account for this line.' : 'New vendor. Not found in any bank rule, the Vendor Master or the email log.' + (out.hint ? ' ' + out.hint : '');
      trace.push('Vendor not found in any of the three sources of truth.');
      return out;
    }

    const gls = [...new Set(cands.map(c => c.gl).filter(Boolean))];
    cands.forEach(c => { c.cls = remapClass(c.cls); });
    const clss = [...new Set(cands.map(c => c.cls).filter(Boolean))];
    if (gls.length > 1 || clss.length > 1) {
      const pick = cands.find(c => c.src === 'Email rule') || cands[0];
      out.gl = pick.gl || ''; out.cls = pick.cls || ''; out.source = pick.src;
      out.reason = 'Sources disagree (' + cands.map(c => `${c.src}: ${c.gl || '-'} / ${c.cls || '-'}`).join('; ') + '). The most recent Jonathan email wins. A person confirms and the Reviewer fixes the stale source.';
      trace.push('Conflict between sources (SOP section 5). Held.');
      return out;
    }
    out.gl = gls[0]; out.source = cands.map(c => c.src).join(' + ');

    /* SOP 4.1 class waterfall */
    let clsFromEmail = false;
    if (email && email.cls) { out.cls = remapClass(email.cls); clsFromEmail = true; trace.push('Class Step 1: class given in Jonathan email log.'); }
    else if (clss[0]) { out.cls = clss[0]; trace.push('Class Step 1: class held by the matched rule / Vendor Master entry.'); }
    else if (bankClass) { out.cls = bankClass; trace.push(`Class Step 2: bank account ${acct.name} maps to ${bankClass}.`); }
    else {
      const k = classFromKeywords(tx.desc, cfg);
      if (k) { out.cls = k.cls; trace.push(`Class Step 4: ${k.why}.`); }
      else if (rec && rec.tier === 'C1') {
        /* SOP section 5: a vendor used across more than one location that the waterfall cannot resolve goes to New.
           SOP 4.1 Step 5: Administrative is the default landing spot, so it is pre-selected for the Team Member. */
        out.lane = 'new'; out.cls = ''; out.adminDefault = true;
        { const cc = coaResolve(cfg.coa, out.gl); if (!cc.error) out.gl = cc.name; }
        out.reason = 'Multi-location vendor. The bank account and description cannot decide the class (SOP section 5), so a Team Member confirms it. Administrative is pre-selected as the default (SOP 4.1 Step 5) and will be on the Administrative Class Review List.';
        trace.push('Class Steps 1 to 4 could not resolve a multi-location vendor. Sent to New Transactions with Administrative pre-selected.');
        return out;
      }
      else { out.cls = mapClass('Administrative', cfg); out.adminReview = true; trace.push('Class Step 5: nothing resolved the class. Administrative for now, added to the Administrative Class Review List.'); }
    }

    out.cls = remapClass(out.cls);
    if (isReserved(out.cls)) {
      out.lane = 'exception'; out.exKind = 'reserved';
      out.reason = `Class "${out.cls}" is reserved for Steven Garcia's personal book or not allowed in Empire.`;
      return out;
    }
    /* Class Step 3: non-US payroll classes are never guessed */
    const pm = (cfg.payrollMap || []).find(p => baseKey(p.name) === vkey && p.cls);
    if (/payroll|salar|wages|executive pay/i.test(out.gl) && !clsFromEmail && pm && !isReserved(pm.cls)) { out.cls = pm.cls; out.source += ' + Payroll Excel'; trace.push(`Class Step 3: class ${pm.cls} taken from the payroll Excel (${pm.name}).`); }
    else if (/payroll|salar|wages|executive pay/i.test(out.gl) && !clsFromEmail && !isUsPayrollClass(out.cls, cfg)) {
      out.reason = `Payroll entry with class "${out.cls}". Upload Louise Petrie's payroll Excel (Data & rules) or confirm the class from her email before posting.`;
      trace.push('Class Step 3: non-US payroll class must be verified. Held.');
      return out;
    }

    /* Account must exist in the chart of accounts when one is loaded */
    const c = coaResolve(cfg.coa, out.gl);
    if (c.error) {
      out.reason = c.error === 'ambiguous' ? `GL "${out.gl}" matches several accounts in the chart of accounts. Pick the right one.` : `GL "${out.gl}" from the ${out.source} is not in the uploaded chart of accounts. Pick the right account.`;
      trace.push('GL not found in the chart of accounts. Held.');
      return out;
    }
    out.gl = c.name; out.glVerified = c.verified;
    out.lane = 'old';
    out.reason = 'Matched with full confidence.';
    return out;
  }

  function proposeClass(tx, cfg) {
    const a = tx.account || {};
    if (a.bankClass) return { cls: mapClass(a.bankClass, cfg), why: `bank account ${a.name}` };
    const k = classFromKeywords(tx.desc, cfg);
    if (k) return { cls: k.cls, why: k.why };
    return { cls: mapClass('Administrative', cfg), why: 'default, will be added to the Administrative Class Review List' };
  }

  function run(txs, cfg) {
    const ix = buildIndex(cfg.master || []);
    return txs.map(tx => {
      const r = classifyOne(tx, cfg, ix);
      const prop = proposeClass(tx, cfg);
      return Object.assign({}, tx, r, { proposedClass: prop.cls, proposedWhy: prop.why, resolved: null });
    });
  }


  /* ---------- check an older, already-categorised file against the SOP (read-only) ---------- */
  function parseFileSide(rec) {
    const L = {}; Object.keys(rec).forEach(k => { L[k.toLowerCase().trim()] = rec[k]; });
    const first = (...n) => { for (const k of n) if (L[k] != null && String(L[k]).trim() !== '') return String(L[k]).trim(); return ''; };
    const out = { how: '', type: '', num: '', name: '', gl: '', cls: first('class', 'expense line class', 'line class'), rule: false };
    const ab = first('added or matched');
    if (ab) {
      const m = ab.match(/^(Added to|Matched to):\s+([A-Za-z][A-Za-z ]*?):\s*(\d+(?:\.\d+)?)?\s*(.*?)(?:\s+DD)?\s+\d{1,2}\/\d{1,2}\/\d{4}/i);
      if (m) { out.how = /^added/i.test(m[1]) ? 'added' : 'matched'; out.type = m[2].trim(); out.num = m[3] || ''; out.name = (m[4] || '').trim(); }
      out.rule = /rule applied/i.test(first('rule'));
    } else {
      const g = first('gl account', 'categorize or match', 'account', 'category', 'expense account', 'line account', 'gl');
      const m = g.match(/^\s*(\d+(?:\.\d+)?)\s+(.*)$/);
      out.num = m ? m[1] : ''; out.name = m ? m[2] : g;
    }
    out.gl = (out.num ? out.num + ' ' : '') + out.name;
    return out;
  }
  function audit(csvText, account, cfg, prefix) {
    const recs = csvToObjects(csvText);
    const txs = loadFeed(csvText, account, prefix || 'a').map(t => Object.assign(t, { suggestedGL: '', suggestedClass: '' }));
    const res = run(txs, cfg);
    const sameGl = (f, sgl) => {
      const sn = glNumber(sgl), fn = f.num ? parseInt(f.num, 10) : null;
      if (sn !== null && fn !== null) return sn === fn;
      const last = x => norm(stripNum(x).split(':').pop());
      return last(f.name) === last(sgl);
    };
    const sameCls = (a, b) => { const l = x => norm(String(x).split(':').pop()); return norm(a) === norm(b) || l(a) === l(b); };
    return res.map(r => {
      const i = parseInt(String(r.id).split('-t').pop(), 10), f = parseFileSide(recs[i] || {});
      const fnum = f.num ? parseInt(f.num, 10) : null;
      const sop = { lane: r.lane, gl: r.gl || '', cls: r.cls || '', reason: r.reason || '' };
      let status, label, why;
      if (/uncategor/i.test(f.name)) { status = 'rule'; label = 'Left uncategorised'; why = 'The file has this posted to "' + f.gl + '". It still needs a real account.'; }
      else if (f.cls && isRetiredClass(f.cls)) { status = 'rule'; label = 'Retired class used'; why = 'Class "' + f.cls + '" is not used. Those items are plain Chicago (Empire Tours:Chicago).'; }
      else if (f.cls && isReserved(f.cls)) { status = 'rule'; label = 'Reserved class used'; why = 'Class "' + f.cls + '" is never valid in Empire QuickBooks (SOP 13.2).'; }
      else if (f.cls && isOwnerClass(f.cls) && !r.steven) { status = 'rule'; label = 'Owner Distribution class'; why = 'Owner Distribution is only for Steven personal charges (SOP 13.2).'; }
      else if (r.payout) {
        if (sameGl(f, r.gl)) { status = 'ok'; label = 'Matches'; why = 'Posted to the Clearing account as the SOP says. The class depends on the location report, so only the account is checked.'; }
        else { status = 'diff'; label = 'Different GL'; why = 'File: ' + (f.gl || '(none)') + '. SOP: payouts go to ' + r.gl + ' (SOP 13.6).'; }
      }
      else if (r.lane === 'scope' || /^transfer$/i.test(f.type)) { status = 'scope'; label = 'Out of scope'; why = r.lane === 'scope' ? r.reason : 'Transfer between accounts. Not part of the Expense / Deposit import.'; }
      else if (r.lane === 'exception') { status = 'unknown'; label = 'Cannot verify'; why = r.reason; }
      else if (r.lane === 'new') { status = 'unknown'; label = 'Cannot verify'; why = r.reason || 'Vendor is new or has several possible GLs.'; }
      else if (r.lane === 'bill') {
        if (/bill payment/i.test(f.type) || !f.type) { status = 'ok'; label = 'Matches'; why = 'SOP: bill payment.'; }
        else { status = 'diff'; label = 'Different treatment'; why = 'SOP: ' + (r.reason || 'bill payment') + ' The file has it as ' + f.type + '.'; }
      }
      else if (/bill payment/i.test(f.type)) { status = 'unknown'; label = 'Cannot verify'; why = 'Paid as a Bill Payment. The SOP would code this directly unless an open bill existed that day, and the A/P report for that day is not available.'; }
      else if (!sameGl(f, r.gl)) { status = 'diff'; label = 'Different GL'; why = 'File: ' + (f.gl || '(none)') + '. SOP: ' + r.gl + (r.source ? ' (' + r.source + ')' : '') + '.'; }
      else if (f.cls && r.cls && !sameCls(f.cls, r.cls)) { status = 'diff'; label = 'Different class'; why = 'File: ' + f.cls + '. SOP: ' + r.cls + (r.source ? ' (' + r.source + ')' : '') + '.'; }
      else { status = 'ok'; label = 'Matches'; why = 'GL' + (f.cls ? ' and class' : '') + ' agree with the SOP.'; }
      return { id: r.id, dateRaw: r.dateRaw, desc: r.desc, payee: r.payee || r.vendor, amount: r.amount, status, label, why, file: { type: f.type, how: f.how, gl: f.gl, cls: f.cls, rule: f.rule }, sop };
    });
  }

  /* ---------- outputs ---------- */
  const isConfirmed = r => !!(r.resolved && r.resolved.confirmed);
  const canConfirm = r => r.lane === 'new' || (r.lane === 'exception' && r.exKind === 'novendor');
  const eff = r => isConfirmed(r) ? { vendor: r.resolved.vendor, gl: r.resolved.gl, cls: r.resolved.cls } : { vendor: r.qboVendor || r.vendor, gl: r.gl, cls: r.cls };
  const isOwnerClass = c => /(^|:)owner distribution$/i.test(String(c || '').trim());
  const isAdminClass = c => /(^|:)administrative$/i.test(String(c || '').trim());

  function importRows(results) {
    return results.filter(r => r.lane === 'old' || (canConfirm(r) && isConfirmed(r) && !(r.resolved && r.resolved.personal)))
      .map(r => {
        const conf = isConfirmed(r), f = eff(r);
        return { id: r.id, date: r.date, dateRaw: r.dateRaw, desc: r.desc, vendor: f.vendor, gl: f.gl, cls: f.cls, amount: r.amount,
          account: r.account ? r.account.name : '', accNum: r.account ? r.account.num : '', accCard: !!(r.account && r.account.card), cur: r.account ? r.account.cur : '', topGl: conf ? 0 : (r.topGl || 0),
          memo: conf ? 'Confirmed by ' + (r.resolved.by || 'team member') + (r.resolved.loc ? ' | Location: ' + r.resolved.loc.replace(/_/g, ' ') : '') : 'Auto: ' + r.source,
          adminReview: conf ? isAdminClass(f.cls) : !!r.adminReview,
          newVendor: !!r.newVendor, limited: !!r.limited, steven: !!r.steven, lane: r.lane };
      });
  }

  const NON_PL = /(payable|accrued|due to|clearing|line of credit|wise 2607|distribution|loan|equity|deferred|receivable|prepaid|credit card|savings|checking|shareholder)/i;
  function isPL(gl) { const g = glNumber(gl); return g !== null ? g >= 40000 : !NON_PL.test(gl || ''); }

  /* Section 8 automated review checks */
  function checks(rows) {
    const flags = [];
    const groups = {};
    rows.forEach(r => { const k = [r.date, baseKey(r.vendor), r.desc.toLowerCase(), r.amount.toFixed(2), r.gl, r.account].join('|'); (groups[k] = groups[k] || []).push(r); });
    Object.values(groups).filter(g => g.length > 1).forEach(g => flags.push({
      id: 'dup:' + g[0].id, kind: 'Possible duplicate posting', severity: 'warn',
      title: `${g.length} identical rows: ${g[0].vendor}, ${g[0].dateRaw}, ${g[0].amount.toFixed(2)}`,
      detail: 'Same date, vendor, description, amount and account. Verify against the source statement.'
    }));

    const pl = rows.filter(r => isPL(r.gl));
    const byVendor = {};
    pl.forEach(r => { (byVendor[baseKey(r.vendor)] = byVendor[baseKey(r.vendor)] || []).push(r); });
    Object.entries(byVendor).forEach(([k, g]) => {
      if (g.length >= 2) {
        const cnt = {}; g.forEach(r => cnt[r.gl] = (cnt[r.gl] || 0) + 1);
        const [topGl, topN] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
        const pct = topN / g.length * 100;
        if (pct < 85) flags.push({ id: 'cons:' + k, kind: 'Account consistency', severity: 'warn', title: `${g[0].vendor}: ${pct.toFixed(0)}% on ${topGl}`, detail: `${g.length} rows across ${Object.keys(cnt).length} accounts in this batch, below the 85% line. Judge whether this is a genuine business vendor or an individual with mixed expenses.` });
      }
      const hist = g.find(r => r.topGl && r.topGl < 85);
      if (hist) flags.push({ id: 'hist:' + k, kind: 'Vendor history below 85%', severity: 'warn', title: `${hist.vendor}: top GL is ${hist.topGl}% in the Vendor Master`, detail: 'The vendor history itself is inconsistent. Judge whether this posting is right.' });
    });

    const drift = {};
    pl.forEach(r => { const k = baseKey(r.vendor) + '|' + r.desc.toLowerCase().replace(/ref:.*$/, '').replace(/[0-9]+/g, '#').trim(); (drift[k] = drift[k] || []).push(r); });
    Object.entries(drift).forEach(([k, g]) => {
      const set = [...new Set(g.map(r => r.gl))];
      if (g.length > 1 && set.length > 1) flags.push({ id: 'drift:' + k, kind: 'Description drift', severity: 'warn', title: `${g[0].vendor}: same description on ${set.length} accounts`, detail: set.join(' / ') + '. A recurring charge may have started hitting a different account partway through.' });
    });

    const names = [...new Set(rows.map(r => baseKey(r.vendor)).filter(Boolean))];
    const tok = n => n.split(' ').filter(Boolean);
    for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
      const a = tok(names[i]), b = tok(names[j]);
      const same = a.length > 1 && b.length > 1 && a[0] === b[0] && a[a.length - 1] === b[b.length - 1];
      const squash = names[i].replace(/[^a-z0-9]/g, '') === names[j].replace(/[^a-z0-9]/g, '');
      if (same || squash) flags.push({ id: 'vdup:' + names[i] + '|' + names[j], kind: 'Possible duplicate vendor', severity: 'warn', title: `"${names[i]}" and "${names[j]}"`, detail: 'Looks like one vendor under two spellings. Check the date ranges for overlap versus a clean cutover before merging.' });
    }

    rows.forEach(r => {
      if (!r.vendor) flags.push({ id: 'nov:' + r.id, kind: 'Missing vendor', severity: 'crit', title: `No vendor on ${r.dateRaw} ${r.desc}`, detail: 'Nothing is posted without a vendor.' });
      if (!r.gl) flags.push({ id: 'nogl:' + r.id, kind: 'Missing account', severity: 'crit', title: `No account for ${r.vendor}`, detail: 'Every row needs a GL account.' });
      if (r.steven) flags.push({ id: 'stv:' + r.id, kind: 'Steven personal', severity: 'warn', title: `${r.vendor} ${r.dateRaw} ${r.amount.toFixed(2)} posted to ${r.gl}`, detail: "Personal charge on an Empire account. Confirm it is Steven's, and that the mirror journal entry is made in his personal book (SOP 13.2)." });
      if (!r.steven && (!r.cls || isReserved(r.cls) || isOwnerClass(r.cls))) flags.push({ id: 'cls:' + r.id, kind: 'Invalid class', severity: 'crit', title: `${r.vendor}: class "${r.cls || 'none'}"`, detail: 'Reserved or empty classes cannot be used in Empire.' });
    });
    return flags;
  }

  /* SaasAnt: the two real templates (Expense-Simple for money out, Deposit-Simple for money in).
     Headers are copied exactly from the templates (including the trailing space in 'Expense Account ').
     Class is required by the SOP but the Simple templates have no class column, so 'Expense Line Class'
     is appended to the Expense sheet; the Deposit template already has 'Line Class'. */
  const SA_EXP = ['Ref No', 'Account', 'Payee', 'Memo', 'Payment Date', 'Payment Method', 'Expense Account ', 'Expense Description', 'Expense Line Amount', 'Expense Line Class'];
  const SA_DEP = ['Deposit No', 'Date', 'Deposit To Account', 'Received From', 'Line Account', 'Line Description', 'Line Payment Method', 'Line Ref No', 'Line Amount', 'Line Class', 'Memo'];
  function saasantSheets(rows) {
    const acct = r => (r.accNum ? r.accNum + ' ' : '') + r.account;
    const dt = r => { const m = String(r.date).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : r.dateRaw; };
    const seq = (r, n) => String(r.date).replace(/-/g, '').slice(2) + '-' + String(n).padStart(3, '0');
    const exp = [SA_EXP.slice()], dep = [SA_DEP.slice()], warn = [];
    let ne = 0, nd = 0;
    rows.forEach(r => {
      if (r.amount < 0) { ne++; exp.push([seq(r, ne), acct(r), r.vendor, r.memo, dt(r), '', r.gl, r.desc, Math.abs(r.amount), r.cls]); }
      else if (r.amount > 0) {
        nd++; dep.push([seq(r, nd), dt(r), acct(r), r.vendor, r.gl, r.desc, '', '', r.amount, r.cls, r.memo]);
        if (r.accCard) warn.push(`${r.dateRaw} ${r.vendor || r.desc}: money IN on a credit card (${r.account}). Check whether this is a refund or a payment before importing it as a deposit.`);
      }
    });
    return { expenses: exp, deposits: dep, nExp: ne, nDep: nd, warn };
  }

  return { audit, parseFileSide, parseCSV, csvToObjects, toCSV, loadFeed, run, importRows, checks, saasantSheets, SA_EXP, SA_DEP, parseMaster, masterIndex: masterHeader, deriveLists, buildIndex, resolveVendor, suggestVendors, coaResolve, MASTER_COLS,
    baseKey, norm, money, isReserved, isAdminClass, isOwnerClass, stevenGl, OWNER_CLASS, canConfirm, isConfirmed, eff, mapClass, isPL, glNumber, stripNum,
    RESERVED, isRetiredClass, remapClass, DEFAULT_PAYOUT_LOCATIONS, payoutOptions, normLoc, findLoc, DEFAULT_CLASS_MAP, DEFAULT_US_PAYROLL, DEFAULT_BILL_ONLY };
})();
if (typeof module !== 'undefined') module.exports = Engine;

const symOf = r => SYM[(r.account && r.account.cur) || 'USD'] || '';

/* ---------- persistence: this browser, plus the shared team storage when it is available ---------- */
function saveLocal(){
  try{ localStorage.setItem('empire3-cfg', JSON.stringify({cfg:S.cfg, coa:S.coa, coaSource:S.coaSource, classesUp:S.classesUp, classSource:S.classSource})); }catch(e){}
  try{ localStorage.setItem('empire4-master', JSON.stringify({header:S.mHeader, base:S.mBase, added:S.mAdded, exclAoa:S.exclAoa, meta:S.mMeta})); }
  catch(e){ toast('Browser storage is blocked or full, so the Vendor Master will not be remembered next time.'); }
}
function saveAll(){ saveLocal(); cloudPush(); }
function loadAll(){
  try{ const j = JSON.parse(localStorage.getItem('empire3-cfg') || 'null'); if(j){ S.cfg = Object.assign(DEFAULT_CFG(), j.cfg||{}); S.coa = j.coa||[]; S.coaSource = j.coaSource||''; S.classesUp = j.classesUp||[]; S.classSource = j.classSource||''; if(S.cfg.billsAt !== today()){ S.cfg.openBills = []; S.cfg.noOpenBills = false; } } }catch(e){}
  try{
    const m = JSON.parse(localStorage.getItem('empire4-master') || 'null');
    if(m && m.header && m.base){ S.mHeader = m.header; S.mBase = m.base; S.mAdded = m.added||[]; S.exclAoa = m.exclAoa||[]; S.mMeta = m.meta; }
    else { const o = JSON.parse(localStorage.getItem('empire3-master') || 'null'); if(o && o.header && o.raws){ S.mHeader = o.header; S.mBase = o.raws; S.exclAoa = o.exclAoa||[]; S.mMeta = o.meta; } }
  }catch(e){}
  rebuildMaster();
}
/* the master used by the engine = the uploaded file plus vendors added by the team since (never twice) */
function syncRaws(){
  if(!S.mHeader.length){ S.mRaws = S.mBase.slice(); return; }
  const vi = Engine.masterIndex([S.mHeader]).vendor;
  const have = new Set(S.mBase.map(r => Engine.norm(String(r[vi]||''))));
  const extra = [];
  S.mAdded.forEach(a => { const k = Engine.norm(String(a.raw[vi]||'')); if(!have.has(k)){ have.add(k); extra.push(a.raw); } });
  S.mRaws = S.mBase.concat(extra);
}
function rebuildMaster(){
  syncRaws();
  try{ S.master = S.mRaws.length ? Engine.parseMaster([S.mHeader].concat(S.mRaws)) : []; }catch(e){ S.master = []; }
  S.master.forEach(m => { if(/^NEW vendor/i.test(m.notes)) m.src = 'new'; });
  S.excluded = (S.exclAoa.slice(1) || []).map(r => ({vendor:String(r[0]||''), gl:String(r[3]||r[1]||'')})).filter(x => x.vendor);
  S.derived = Engine.deriveLists(S.master);
}
/* ---------- team storage (shared database, when the page is granted it) ---------- */
const CL = {db:null, state:'off', readonly:false, last:{}, snap:{}, seen:{}, ready:false, want:false, dirty:false, flushing:false, again:false, timer:null, nChunks:0, waiting:0, stale:false};
const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ss = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const CL_LISTS = {emailRules:'emailrules', bankRules:'bankrules', newVendorLog:'nvlog', payrollMap:'payroll'};
const CHUNK = 40;
function ensureIds(){ Object.keys(CL_LISTS).forEach(k => (S.cfg[k]||[]).forEach(r => { if(!r._id) r._id = rid(); })); S.mAdded.forEach(a => { if(!a._id) a._id = rid(); }); }
const clDocs = () => {
  const o = {
    'team/cfg': {classMap:S.cfg.classMap, classOverrides:S.cfg.classOverrides, usPayrollClasses:S.cfg.usPayrollClasses, billOnlyPatterns:S.cfg.billOnlyPatterns, stevenPost:S.cfg.stevenPost !== false},

  if(S.cfg.billsAt === today()) o['team/bills'] = {list:S.cfg.openBills, at:S.cfg.billsAt, none:!!S.cfg.noOpenBills};

};
const clMasterObj = () => ({header:S.mHeader, excl:S.exclAoa, meta:S.mMeta, rows:S.mBase});
